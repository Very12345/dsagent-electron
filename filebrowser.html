<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>文件浏览器</title>
    <style>
        :root {
            --bg-base: #0d1117;
            --bg-panel: #161b22;
            --bg-elevated: #1c2333;
            --bg-hover: rgba(56,139,253,0.08);
            --bg-active: rgba(56,139,253,0.12);
            --border: rgba(48,54,61,0.6);
            --border-light: rgba(48,54,61,0.3);
            --border-active: #388bfd;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #388bfd;
            --accent-2: #8957e5;
            --accent-gradient: linear-gradient(135deg, #388bfd, #8957e5);
            --success: #3fb950;
            --danger: #f85149;
            --warning: #d29922;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
            --shadow-glow: 0 0 20px rgba(56,139,253,0.15);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: 0.15s var(--transition);
            --transition-normal: 0.25s var(--transition);
        }

        body.light {
            --bg-base: #ffffff;
            --bg-panel: #f6f8fa;
            --bg-elevated: #ffffff;
            --bg-hover: rgba(9,105,218,0.06);
            --bg-active: rgba(9,105,218,0.10);
            --border: #d0d7de;
            --border-light: #eaeef2;
            --border-active: #0969da;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-muted: #8c959f;
            --accent: #0969da;
            --accent-2: #8250df;
            --accent-gradient: linear-gradient(135deg, #0969da, #8250df);
            --success: #1a7f37;
            --danger: #cf222e;
            --warning: #9a6700;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-glow: 0 0 20px rgba(9,105,218,0.10);
        }

        /* 文件类型图标 — 浅色主题覆盖 */
        body.light .file-icon.dir { background: #e0e7ff; color: #4338ca; }
        body.light .file-icon.img { background: #dcfce7; color: #15803d; }
        body.light .file-icon.code { background: #dbeafe; color: #1d4ed8; }
        body.light .file-icon.doc { background: #ffedd5; color: #c2410c; }
        body.light .file-icon.data { background: #f3f4f6; color: #52525b; }
        body.light .file-icon.media { background: #f3e8ff; color: #7e22ce; }
        body.light .file-icon.archive { background: #fef9c3; color: #a16207; }
        body.light .file-icon.exe { background: #fce4ec; color: #c62828; }
        body.light .file-icon.default { background: #e5e7eb; color: #6b7280; }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, transparent) 0%, color-mix(in srgb, var(--accent-2) 3%, transparent) 40%, transparent 80%), var(--bg-base);
            color: var(--text-primary);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        /* ========== HEADER ========== */
        .header {
            background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 4%, transparent) 0%, transparent 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        /* ========== 窗口控制按钮栏（无原生标题栏） ========== */
        #winctrl-bar {
            -webkit-app-region: drag;
            display: flex; align-items: center; justify-content: flex-end;
            height: 38px; padding-right: 4px; flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, transparent) 0%, color-mix(in srgb, var(--accent-2) 4%, transparent) 100%);
        }
        .win-ctrl-btn {
            -webkit-app-region: no-drag;
            width: 46px; height: 100%; border: none;
            background: transparent; color: var(--text-secondary);
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 12px;
            transition: background 0.1s, color 0.1s;
        }
        .win-ctrl-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .win-ctrl-btn.close:hover { background: #e81123; color: #fff; }
        .win-ctrl-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .toolbar {
            display: flex; gap: 8px; align-items: center;
            padding: 12px 16px; flex-wrap: wrap;
        }
        .toolbar .nav-btn {
            background: var(--bg-elevated); border: 1px solid var(--border);
            color: var(--text-primary); padding: 6px 12px; border-radius: var(--radius-md);
            cursor: pointer; font-size: 12px; font-weight: 500;
            transition: all var(--transition-fast); white-space: nowrap;
        }
        .toolbar .nav-btn:hover {
            background: var(--bg-hover); border-color: var(--accent);
            color: var(--text-primary); transform: translateY(-1px);
            box-shadow: var(--shadow-glow);
        }
        .path-bar {
            flex: 1; display: flex; gap: 6px; align-items: center;
            background: var(--bg-elevated); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: var(--radius-md); min-width: 160px;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .path-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
        }
        .path-bar input {
            flex: 1; background: transparent; border: none;
            color: var(--text-primary); padding: 5px 4px; font-size: 12px;
            font-family: 'Cascadia Code','Fira Code',Consolas,monospace;
            outline: none; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .path-bar input::placeholder { color: var(--text-secondary); }
        .path-bar .go-btn {
            background: var(--accent-gradient);
            border: none; color: #fff; padding: 4px 12px; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 11px; font-weight: 600;
            transition: all var(--transition-fast);
        }
        .path-bar .go-btn:hover {
            box-shadow: var(--shadow-glow); transform: translateY(-1px);
        }
        #searchInput {
            background: var(--bg-elevated); border: 1px solid var(--border);
            color: var(--text-primary); padding: 6px 12px; border-radius: var(--radius-md);
            font-size: 12px; outline: none; width: 140px;
            transition: all var(--transition-normal);
        }
        #searchInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); width: 180px;
        }
        #searchInput::placeholder { color: var(--text-secondary); }
        /* ========== BREADCRUMB ========== */
        .breadcrumb {
            display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
            padding: 6px 16px; font-size: 12px;
            border-top: 1px solid var(--border-light);
        }
        .breadcrumb span {
            cursor: pointer; color: var(--text-secondary); padding: 2px 6px;
            border-radius: var(--radius-sm); transition: all var(--transition-fast);
        }
        .breadcrumb span:hover { background: var(--bg-hover); color: var(--accent); }
        .breadcrumb .sep { color: var(--text-muted); cursor: default; padding: 2px 2px; }
        .breadcrumb .sep:hover { background: transparent; color: var(--text-muted); }
        /* ========== FILE LIST ========== */
        .file-list {
            flex: 1; overflow-y: auto; padding: 0;
            background: var(--bg-base);
        }
        /* Column header */
        .list-header {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px; font-size: 11px; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            background: color-mix(in srgb, var(--bg-panel) 80%, transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 2;
        }
        .list-header .h-icon { width: 36px; text-align: center; }
        .list-header .h-name { flex: 1; }
        .list-header .h-size { min-width: 55px; text-align: right; }
        .list-header .h-actions { width: 84px; text-align: right; }
        .file-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            cursor: pointer; transition: all var(--transition-fast);
        }
        .file-item:hover {
            background: var(--bg-hover);
        }
        .file-item:last-child { border-bottom: none; }
        /* File icon - solid colors for high contrast */
        .file-icon {
            width: 34px; height: 26px; border-radius: var(--radius-sm);
            text-align: center; line-height: 26px;
            font-size: 14px; flex-shrink: 0;
        }
        .file-icon.dir {
            background: #312e81; color: #c7d2fe;
        }
        .file-icon.img {
            background: #14532d; color: #86efac;
        }
        .file-icon.code {
            background: #1e3a5f; color: #93c5fd;
        }
        .file-icon.doc {
            background: #7c2d12; color: #fdba74;
        }
        .file-icon.data {
            background: #3f3f46; color: #d4d4d8;
        }
        .file-icon.media {
            background: #581c87; color: #e9d5ff;
        }
        .file-icon.archive {
            background: #713f12; color: #fde047;
        }
        .file-icon.exe {
            background: #450a0a; color: #fca5a5;
        }
        .file-icon.default {
            background: #27272a; color: #a1a1aa;
        }
        .file-name {
            flex: 1; font-size: 13px; font-weight: 500;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--text-primary);
        }
        .directory { color: var(--accent); font-weight: 600; }
        .file { color: var(--text-primary); }
        .file-size {
            font-size: 11px; color: var(--text-secondary); white-space: nowrap;
            min-width: 55px; text-align: right;
            font-family: 'Cascadia Code','Fira Code',Consolas,monospace;
            font-variant-numeric: tabular-nums;
        }
        .file-item:hover .file-size { color: var(--text-primary); }
        /* Actions - icon buttons */
        .file-actions {
            display: flex; gap: 2px; flex-shrink: 0; justify-content: flex-end;
            width: 84px; opacity: 0; transition: opacity var(--transition-fast);
            align-items: center;
        }
        .file-item:hover .file-actions { opacity: 1; }
        .file-actions button {
            border: none; width: 26px; height: 26px; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 13px; line-height: 26px;
            text-align: center; transition: all var(--transition-fast);
            background: var(--bg-hover); padding: 0;
            color: var(--text-secondary);
        }
        .file-actions button:hover { transform: scale(1.12); }
        .file-actions .chat-btn { color: var(--success); }
        .file-actions .chat-btn:hover { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
        .file-actions .rename-btn { color: var(--accent-2); }
        .file-actions .rename-btn:hover { background: color-mix(in srgb, var(--accent-2) 30%, transparent); color: var(--accent-2); }
        .file-actions .delete-btn { color: var(--danger); }
        .file-actions .delete-btn:hover { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
        /* Directory hint on hover */
        .file-item .dir-hint {
            font-size: 10px; color: var(--text-muted); margin-left: 6px;
            opacity: 0; transition: opacity var(--transition-fast);
        }
        .file-item:hover .dir-hint { opacity: 1; }
        /* ========== STATUS BAR ========== */
        .status-bar {
            background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 3%, transparent) 0%, var(--bg-base) 100%);
            padding: 0 16px;
            border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
            height: 40px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .status-bar .stats { color: var(--text-muted); font-size: 11px; }
        .status-bar .stats span { color: var(--text-secondary); margin: 0 3px; }
        #currentRoot { font-family: 'Cascadia Code',Consolas,monospace; font-size: 11px; color: var(--accent); }
        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--accent) 55%, transparent); }
        /* ========== EMPTY / LOADING ========== */
        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
        .empty-state .title { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
        .empty-state .subtitle { font-size: 12px; color: var(--text-muted); }
        .file-name + input[type="text"] {
            background: var(--bg-elevated) !important; color: var(--text-primary) !important;
            border: 1px solid var(--accent) !important; outline: none !important;
            padding: 2px 6px !important; font-size: 13px !important;
            font-family: inherit !important; border-radius: var(--radius-sm) !important;
            width: 100% !important; box-sizing: border-box !important;
        }
        /* file-icon 跟随浅色/深色主题自适应 */
    </style>
</head>
<body>
    <div id="winctrl-bar">
        <button class="win-ctrl-btn" id="win-min" title="最小化">
            <svg viewBox="0 0 16 16"><rect x="2" y="7.5" width="12" height="1" rx="0.5"/></svg>
        </button>
        <button class="win-ctrl-btn" id="win-max" title="最大化">
            <svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="win-ctrl-btn close" id="win-close" title="关闭">
            <svg viewBox="0 0 16 16"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06z"/></svg>
        </button>
    </div>
    <div class="header">
        <div class="toolbar">
            <button id="upBtn" class="nav-btn">⬆ 上级</button>
            <button id="refreshBtn" class="nav-btn">↻ 刷新</button>
            <div class="path-bar">
                <input type="text" id="pathInput" placeholder="输入路径后回车">
                <button class="go-btn" id="goBtn">跳转</button>
            </div>
            <input type="text" id="searchInput" placeholder="搜索文件...">
        </div>
        <div id="breadcrumb" class="breadcrumb"></div>
    </div>
    <div id="fileList" class="file-list">
        <div class="empty-state">
            <div class="icon">📂</div>
            <div class="title">加载中...</div>
        </div>
    </div>
    <div class="status-bar">
        <span id="statusText">就绪</span>
        <span id="syncSkillsBtn" style="display:none;cursor:pointer;font-size:11px;padding:2px 8px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);user-select:none;" title="将公共技能同步到当前工作目录">同步技能</span>
        <span id="syncProgressSpan" style="display:none;font-size:11px;color:var(--text-muted);"></span>
        <span class="stats" id="statsInfo"></span>
        <span>根目录: <span id="currentRoot">未打开</span></span>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        let currentPath = '';
        let currentRoot = null;
        let lastLoadedFiles = [];
        let lastLoadedDir = '';

        function loadDirectory(path) {
            if (!currentRoot) {
                showEmpty('📂', '请先选择根目录', '通过菜单 文件 > 打开文件夹 选择');
                document.getElementById('statusText').innerText = '未打开文件夹';
                return;
            }

            showEmpty('⏳', '加载中...', '');
            document.getElementById('statusText').innerText = '正在加载 ' + path;

            ipcRenderer.invoke('list-dir', path).then(result => {
                if (result.success) {
                    currentPath = result.path;
                    lastLoadedFiles = result.files;
                    lastLoadedDir = result.path;
                    document.getElementById('pathInput').value = currentPath;
                    document.getElementById('currentRoot').innerText = currentRoot;
                    applySearchFilter();
                    updateStats(result.files);
                    document.getElementById('statusText').innerText = '已加载 ' + result.files.length + ' 个项目';
                    // 同步刷新历史对话
                    ipcRenderer.send('request-history-refresh');
                } else {
                    showEmpty('⚠️', '加载失败', result.error);
                    document.getElementById('statusText').innerText = '加载失败';
                }
            }).catch(err => {
                showEmpty('⚠️', '错误', err.message);
            });
        }

        function showEmpty(icon, title, subtitle) {
            const container = document.getElementById('fileList');
            container.innerHTML = '<div class="empty-state">'
                + '<div class="icon">' + icon + '</div>'
                + '<div class="title">' + title + '</div>'
                + (subtitle ? '<div class="subtitle">' + subtitle + '</div>' : '')
                + '</div>';
        }

        function updateStats(files) {
            if (!files) { document.getElementById('statsInfo').innerText = ''; return; }
            const dirs = files.filter(f => f.isDir).length;
            const fileCount = files.length - dirs;
            const parts = [];
            if (dirs > 0) parts.push(dirs + ' 个目录');
            if (fileCount > 0) parts.push(fileCount + ' 个文件');
            document.getElementById('statsInfo').innerText = parts.join('  ·  ');
        }

        function isUnderRoot(dirPath) {
            if (!currentRoot) return false;
            const rel = dirPath.replace(/\//g, '\\');
            const root = currentRoot.replace(/\//g, '\\');
            return rel === root || rel.startsWith(root + '\\');
        }

        function getParentPath(dirPath) {
            const parts = dirPath.replace(/\//g, '\\').split('\\');
            parts.pop();
            return parts.join('\\') || dirPath;
        }
        
        function renderFileList(files, currentDir) {
            const container = document.getElementById('fileList');
            if (!files || files.length === 0) {
                showEmpty('📁', '空目录', '此目录下没有文件');
                updateStats([]);
                return;
            }
            
            // 按目录优先排序
            files.sort((a, b) => {
                if (a.isDir === b.isDir) return a.name.localeCompare(b.name);
                return a.isDir ? -1 : 1;
            });
            
            updateStats(files);
            
            // Build list with header
            let html = '<div class="list-header">'
                + '<div class="h-icon"></div>'
                + '<div class="h-name">文件名</div>'
                + '<div class="h-size">大小</div>'
                + '<div class="h-actions">操作</div>'
                + '</div>';
            
            files.forEach(file => {
                const iconInfo = getFileIcon(file.name, file.isDir);
                const hint = file.isDir ? '<span class="dir-hint">双击进入</span>' : '';
                
                html += '<div class="file-item" draggable="true" data-name="' + escapeHtml(file.name) + '" data-path="' + escapeHtml(pathJoin(currentDir, file.name)) + '">'
                    + '<div class="file-icon ' + iconInfo.cls + '">' + iconInfo.emoji + '</div>'
                    + '<div class="file-name ' + (file.isDir ? 'directory' : 'file') + '">' + escapeHtml(file.name) + hint + '</div>'
                    + '<div class="file-size">' + (file.isDir ? '' : formatFileSize(file.size)) + '</div>'
                    + '<div class="file-actions">';
                
                if (!file.isDir) {
                    html += '<button class="chat-btn" title="发送到对话" data-action="chat">→</button>';
                }
                html += '<button class="rename-btn" title="重命名" data-action="rename">✎</button>'
                    + '<button class="delete-btn" title="删除" data-action="delete">✕</button>'
                    + '</div></div>';
            });
            
            container.innerHTML = html;
            
            // Attach event listeners
            container.querySelectorAll('.file-item').forEach(item => {
                const name = item.dataset.name;
                const file = files.find(f => f.name === name);
                if (!file) return;
                
                // 拖拽文件路径到 Agent 或其他目标
                item.addEventListener('dragstart', function(e) {
                    var fullPath = pathJoin(currentDir, file.name);
                    e.dataTransfer.setData('text/plain', fullPath);
                    e.dataTransfer.effectAllowed = 'copy';
                });
                
                item.ondblclick = () => {
                    if (file.isDir) {
                        loadDirectory(pathJoin(currentDir, file.name));
                    } else {
                        ipcRenderer.invoke('open-file', pathJoin(currentDir, file.name));
                    }
                };
                
                item.querySelectorAll('button').forEach(btn => {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        const fullPath = pathJoin(currentDir, file.name);
                        if (action === 'chat') {
                            ipcRenderer.invoke('send-path-to-chat', fullPath);
                        } else if (action === 'delete') {
                            ipcRenderer.invoke('fb-confirm-file-delete', file.name).then(function(res) {
                                if (res && res.confirmed) {
                                    ipcRenderer.invoke('delete-file', fullPath, file.isDir).then(() => {
                                        loadDirectory(currentPath);
                                    });
                                }
                            });
                        } else if (action === 'rename') {
                            const nameEl = item.querySelector('.file-name');
                            const oldName = nameEl.childNodes[0].textContent;
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.value = oldName;
                            input.style.cssText = 'background:#1e1e2e;color:#f1f5f9;border:1px solid #8b5cf6;outline:none;padding:2px 6px;font-size:13px;font-family:inherit;border-radius:4px;width:100%;box-sizing:border-box;';
                            nameEl.childNodes[0].replaceWith(input);
                            input.focus();
                            input.select();
                            function finishRename() {
                                const newName = input.value.trim();
                                input.replaceWith(document.createTextNode(oldName));
                                if (newName && newName !== oldName) {
                                    ipcRenderer.invoke('rename-file', fullPath, newName).then((res) => {
                                        if (res.success) loadDirectory(currentPath);
                                        else alert('重命名失败: ' + (res.error || '未知错误'));
                                    });
                                }
                            }
                            input.addEventListener('keydown', (ke) => {
                                if (ke.key === 'Enter') { ke.preventDefault(); finishRename(); }
                                if (ke.key === 'Escape') { input.replaceWith(document.createTextNode(oldName)); }
                            });
                            input.addEventListener('blur', finishRename);
                        }
                    };
                });
            });
        }
        
        function getFileIcon(filename, isDir) {
            if (isDir) return { emoji: '📁', cls: 'dir' };
            const ext = filename.split('.').pop().toLowerCase();
            const map = {
                js: { emoji: '📜', cls: 'code' }, jsx: { emoji: '⚛️', cls: 'code' },
                ts: { emoji: '📘', cls: 'code' }, tsx: { emoji: '⚛️', cls: 'code' },
                html: { emoji: '🌐', cls: 'code' }, htm: { emoji: '🌐', cls: 'code' },
                css: { emoji: '🎨', cls: 'code' }, scss: { emoji: '🎨', cls: 'code' }, sass: { emoji: '🎨', cls: 'code' },
                json: { emoji: '📋', cls: 'data' }, xml: { emoji: '📋', cls: 'data' }, yaml: { emoji: '📋', cls: 'data' }, yml: { emoji: '📋', cls: 'data' },
                md: { emoji: '📝', cls: 'doc' }, txt: { emoji: '📄', cls: 'doc' }, rtf: { emoji: '📄', cls: 'doc' },
                py: { emoji: '🐍', cls: 'code' }, java: { emoji: '☕', cls: 'code' },
                cpp: { emoji: '⚙️', cls: 'code' }, c: { emoji: '⚙️', cls: 'code' }, h: { emoji: '⚙️', cls: 'code' }, hpp: { emoji: '⚙️', cls: 'code' },
                cs: { emoji: '#️⃣', cls: 'code' }, go: { emoji: '🐹', cls: 'code' }, rs: { emoji: '🦀', cls: 'code' },
                php: { emoji: '🐘', cls: 'code' }, rb: { emoji: '💎', cls: 'code' }, swift: { emoji: '🕊️', cls: 'code' }, kt: { emoji: '🟣', cls: 'code' },
                sql: { emoji: '🗃️', cls: 'data' }, db: { emoji: '🗃️', cls: 'data' }, sqlite: { emoji: '🗃️', cls: 'data' },
                exe: { emoji: '⚡', cls: 'exe' }, dll: { emoji: '⚡', cls: 'exe' }, bat: { emoji: '⚡', cls: 'exe' }, sh: { emoji: '⚡', cls: 'exe' }, cmd: { emoji: '⚡', cls: 'exe' },
                jpg: { emoji: '🖼️', cls: 'img' }, jpeg: { emoji: '🖼️', cls: 'img' }, png: { emoji: '🖼️', cls: 'img' },
                gif: { emoji: '🎬', cls: 'img' }, svg: { emoji: '🎨', cls: 'img' }, webp: { emoji: '🖼️', cls: 'img' }, ico: { emoji: '🖼️', cls: 'img' },
                bmp: { emoji: '🖼️', cls: 'img' }, tiff: { emoji: '🖼️', cls: 'img' },
                mp3: { emoji: '🎵', cls: 'media' }, wav: { emoji: '🎵', cls: 'media' }, flac: { emoji: '🎵', cls: 'media' }, ogg: { emoji: '🎵', cls: 'media' },
                mp4: { emoji: '🎬', cls: 'media' }, avi: { emoji: '🎬', cls: 'media' }, mkv: { emoji: '🎬', cls: 'media' }, mov: { emoji: '🎬', cls: 'media' },
                pdf: { emoji: '📕', cls: 'doc' }, doc: { emoji: '📘', cls: 'doc' }, docx: { emoji: '📘', cls: 'doc' }, xls: { emoji: '📗', cls: 'doc' }, xlsx: { emoji: '📗', cls: 'doc' }, ppt: { emoji: '📙', cls: 'doc' }, pptx: { emoji: '📙', cls: 'doc' },
                zip: { emoji: '📦', cls: 'archive' }, rar: { emoji: '📦', cls: 'archive' }, '7z': { emoji: '📦', cls: 'archive' }, tar: { emoji: '📦', cls: 'archive' }, gz: { emoji: '📦', cls: 'archive' },
                log: { emoji: '📋', cls: 'data' }, cfg: { emoji: '⚙️', cls: 'code' }, ini: { emoji: '⚙️', cls: 'code' }, env: { emoji: '🔐', cls: 'data' }
            };
            return map[ext] || { emoji: '📄', cls: 'default' };
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function applySearchFilter() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                renderFileList(lastLoadedFiles, lastLoadedDir);
                document.getElementById('statusText').innerText = '已加载 ' + lastLoadedFiles.length + ' 个项目';
            } else {
                const filtered = lastLoadedFiles.filter(function(f) {
                    return f.name.toLowerCase().includes(query);
                });
                renderFileList(filtered, lastLoadedDir);
                document.getElementById('statusText').innerText = '找到 ' + filtered.length + ' 个结果 (共 ' + lastLoadedFiles.length + ' 个)';
            }
        }
        
        function pathJoin(...parts) {
            return parts.join('\\').replace(/\\\\/g, '\\');
        }
        
        function updateBreadcrumb(dirPath) {
            const container = document.getElementById('breadcrumb');
            const parts = dirPath.split('\\');
            container.innerHTML = '';
            
            let current = '';
            parts.forEach((part, index) => {
                if (index > 0) {
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.innerText = ' › ';
                    container.appendChild(sep);
                }
                
                const crumb = document.createElement('span');
                crumb.innerText = part || (part === '' ? '根' : part);
                if (index < parts.length - 1) {
                    current += (current ? '\\' : '') + part;
                    crumb.onclick = () => loadDirectory(current);
                }
                container.appendChild(crumb);
            });
        }
        
        document.getElementById('upBtn').onclick = () => {
            const parent = getParentPath(currentPath);
            if (!isUnderRoot(parent)) {
                document.getElementById('statusText').innerText = '已到达根目录边界';
                return;
            }
            if (parent && parent !== currentPath) {
                loadDirectory(parent);
            }
        };

        document.getElementById('refreshBtn').onclick = () => {
            if (currentPath) loadDirectory(currentPath);
        };

        document.getElementById('goBtn').onclick = () => {
            const newPath = document.getElementById('pathInput').value;
            if (newPath) {
                if (!isUnderRoot(newPath)) {
                    document.getElementById('statusText').innerText = '不允许访问根目录以外的路径';
                    return;
                }
                loadDirectory(newPath);
            }
        };

        document.getElementById('pathInput').onkeypress = (e) => {
            if (e.key === 'Enter') document.getElementById('goBtn').click();
        };

        document.getElementById('searchInput').addEventListener('input', applySearchFilter);

        // 同步技能按钮 + 进度
        document.getElementById('syncSkillsBtn').addEventListener('click', function() {
            var btn = this;
            var progress = document.getElementById('syncProgressSpan');
            btn.style.display = 'none';
            progress.style.display = '';
            progress.innerText = '正在同步...';
            ipcRenderer.send('sync-skills-start');
        });
        ipcRenderer.on('sync-skills-progress', (event, data) => {
            var progress = document.getElementById('syncProgressSpan');
            var btn = document.getElementById('syncSkillsBtn');
            if (data.status === 'done') {
                progress.innerText = '✅ 同步完成';
                setTimeout(function() { progress.style.display = 'none'; }, 3000);
            } else if (data.status === 'error') {
                progress.innerText = '❌ ' + (data.message || '同步失败');
                setTimeout(function() { progress.style.display = 'none'; btn.style.display = ''; }, 3000);
            } else if (data.status === 'scanning') {
                progress.innerText = data.message || '扫描中...';
            } else {
                progress.innerText = data.message || '同步中...';
            }
        });
        // 当根目录切换时，显示同步按钮
        ipcRenderer.on('root-changed', (event, newRoot) => {
            currentRoot = newRoot;
            document.getElementById('currentRoot').innerText = newRoot || '未打开';
            var syncBtn = document.getElementById('syncSkillsBtn');
            var progress = document.getElementById('syncProgressSpan');
            if (newRoot) {
                syncBtn.style.display = ''; // 显示同步按钮
                progress.style.display = 'none';
                loadDirectory(newRoot);
            } else {
                currentPath = '';
                syncBtn.style.display = 'none';
                progress.style.display = 'none';
                showEmpty('📂', '请先选择根目录', '通过菜单 文件 > 打开文件夹 选择');
                document.getElementById('statusText').innerText = '文件夹已关闭';
                document.getElementById('pathInput').value = '';
                document.getElementById('breadcrumb').innerHTML = '';
                document.getElementById('statsInfo').innerText = '';
            }
        });

        let autoRefreshTimer = null;
        let lastRenderedSnapshot = '';

        function getFileListSnapshot(files) {
            return (files || []).map(function(f) {
                return f.name + '|' + (f.isDir ? 'D' : 'F') + '|' + f.size + '|' + f.modifiedTime;
            }).sort().join(',');
        }

        async function refreshIfChanged() {
            if (!currentPath || !currentRoot) return;
            try {
                var result = await ipcRenderer.invoke('list-dir', currentPath);
                if (!result.success) return;
                var snapshot = getFileListSnapshot(result.files);
                if (snapshot !== lastRenderedSnapshot) {
                    lastRenderedSnapshot = snapshot;
                    currentPath = result.path;
                    lastLoadedFiles = result.files;
                    lastLoadedDir = result.path;
                    document.getElementById('pathInput').value = currentPath;
                    document.getElementById('currentRoot').innerText = currentRoot;
                    applySearchFilter();
                    document.getElementById('statusText').innerText = '已加载 ' + result.files.length + ' 个项目';
                }
            } catch(e) {}
        }

        function startAutoRefresh() {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(refreshIfChanged, 5000);
        }

        ipcRenderer.on('fb-theme', (event, theme) => {
            document.body.classList.toggle('light', theme === 'light');
        });

        startAutoRefresh();

        ipcRenderer.invoke('get-initial-dir').then(result => {
            if (result.success && result.path) {
                currentRoot = result.path;
                document.getElementById('currentRoot').innerText = currentRoot;
                loadDirectory(result.path);
            } else {
                showEmpty('📂', '请先选择根目录', '通过菜单 文件 > 打开文件夹 选择');
            }
        });

        // ========== 窗口控制（最小化/最大化/关闭） ==========
        document.getElementById('win-min').addEventListener('click', function() {
            ipcRenderer.send('titlebar-window-control', 'minimize');
        });
        document.getElementById('win-max').addEventListener('click', function() {
            ipcRenderer.send('titlebar-window-control', 'maximize');
        });
        document.getElementById('win-close').addEventListener('click', function() {
            ipcRenderer.send('titlebar-window-control', 'close');
        });
    </script>
</body>
