<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./node_modules/@mdi/font/css/materialdesignicons.min.css">
<style>
/* ==================== 主题变量（合并自三个子页面，统一管理） ==================== */
:root {
    --bg-base: #0d1117;
    --bg-panel: #161b22;
    --bg-elevated: #1c2333;
    --bg-chat: #0d1117;
    --bg-hover: rgba(56,139,253,0.08);
    --bg-active: rgba(56,139,253,0.12);
    --border: rgba(48,54,61,0.6);
    --border-light: rgba(48,54,61,0.3);
    --border-active: #388bfd;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #388bfd;
    --accent-2: #8957e5;
    --accent-gradient: linear-gradient(135deg, #388bfd, #8957e5);
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
    --cyan: #22d3ee;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-glow: 0 0 12px rgba(56,139,253,0.3);
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --transition: cubic-bezier(0.4, 0, 0.2, 1);
    --transition-fast: 0.15s var(--transition);
    --transition-normal: 0.25s var(--transition);
    --bg-gradient: linear-gradient(180deg, color-mix(in srgb, var(--accent) 3%, transparent) 0%, transparent 100%);
    --surface-muted: rgba(255,255,255,0.06);
    --surface-muted-strong: rgba(255,255,255,0.1);
    --hover-overlay: rgba(255,255,255,0.06);
    --accent-soft: rgba(56,139,253,0.08);
    --accent-soft-strong: rgba(56,139,253,0.18);
}
body.light {
    --bg-base: #ffffff;
    --bg-panel: #f6f8fa;
    --bg-elevated: #ffffff;
    --bg-chat: #f6f8fa;
    --bg-hover: rgba(9,105,218,0.06);
    --bg-active: rgba(9,105,218,0.10);
    --border: #d0d7de;
    --border-light: #eaeef2;
    --border-active: #0969da;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --text-muted: #8c959f;
    --accent: #0969da;
    --accent-2: #8250df;
    --accent-gradient: linear-gradient(135deg, #0969da, #8250df);
    --success: #1a7f37;
    --danger: #cf222e;
    --warning: #9a6700;
    --cyan: #0969da;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    --shadow-glow: 0 0 12px rgba(9,105,218,0.15);
    --bg-gradient: linear-gradient(180deg, color-mix(in srgb, var(--accent) 3%, transparent) 0%, transparent 100%);
    --surface-muted: rgba(0,0,0,0.05);
    --surface-muted-strong: rgba(0,0,0,0.08);
    --hover-overlay: rgba(0,0,0,0.06);
    --accent-soft: rgba(9,105,218,0.06);
    --accent-soft-strong: rgba(9,105,218,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg-base);
    font-family: system-ui, 'Segoe UI', sans-serif;
    color: var(--text-primary);
    user-select: none;
}

/* ==================== 整体布局（flexbox，缩放自动适应） ==================== */
#app {
    display: flex;
    width: 100vw; height: 100vh;
    flex-direction: column;
}

/* 标题栏行：横跨全宽，窗口按钮固定在右上角 */
#titlebar-row {
    display: flex;
    height: 38px;
    flex-shrink: 0;
    align-items: center;
    -webkit-app-region: drag;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, transparent) 0%, color-mix(in srgb, var(--accent-2) 4%, transparent) 100%);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 10;
    padding-left: 8px;
}
#titlebar-icon {
    width: 28px; height: 28px;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    flex-shrink: 0;
}
#titlebar-text {
    font-size: 12px; font-weight: 600;
    color: var(--text-primary);
    margin-left: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
    min-width: 0;
}
/* 窗口控制按钮组 — 固定在标题栏最右侧 */
#win-ctrl-group {
    -webkit-app-region: no-drag;
    display: flex;
    height: 38px;
    margin-left: auto;
    flex-shrink: 0;
}
#win-ctrl-group button {
    width: 46px; height: 100%; border: none;
    background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    transition: background 0.1s, color 0.1s;
}
#win-ctrl-group button:hover { background: var(--accent-soft, rgba(255,255,255,0.1)); color: var(--text-primary); }
#win-ctrl-group button.close:hover { background: #e81123; color: #fff; }
#win-ctrl-group button svg { width: 16px; height: 16px; fill: currentColor; }

/* 菜单栏按钮 */
#menubar-btns {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 2px;
    margin-left: 8px;
    flex-shrink: 1;
    min-width: 0;
    overflow: hidden;
}
.mb-btn {
    height: 28px; padding: 0 10px; border: none; border-radius: 4px;
    background: transparent; color: var(--text-secondary);
    font-size: 13px; cursor: pointer; font-family: inherit;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
}
.mb-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.mb-btn:active, .mb-btn.open { background: var(--bg-active); color: var(--accent); }

/* 菜单弹出层 */
#titlebar-menu-overlay {
    display: none;
    position: fixed;
    z-index: 99998;
    background: var(--bg-elevated, #1c2333);
    border: 1px solid var(--border, rgba(48,54,61,0.6));
    border-radius: 8px;
    padding: 4px 0;
    min-width: 220px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
#titlebar-menu-overlay .menu-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px; font-size: 13px;
    color: var(--text-primary, #e6edf3);
    cursor: pointer; transition: background 0.1s;
}
#titlebar-menu-overlay .menu-item:hover { background: var(--bg-hover, rgba(56,139,253,0.08)); }
#titlebar-menu-overlay .menu-item.disabled { color: var(--text-muted); cursor: default; pointer-events: none; }
#titlebar-menu-overlay .menu-sep { height: 1px; background: var(--border, rgba(48,54,61,0.6)); margin: 4px 8px; }
#titlebar-menu-overlay .menu-radio { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; border: 1.5px solid var(--text-secondary); flex-shrink: 0; }
#titlebar-menu-overlay .menu-radio.checked { border-color: var(--accent, #388bfd); background: var(--accent, #388bfd); }
#titlebar-menu-overlay .menu-accel { font-size: 11px; color: var(--text-secondary); margin-left: 24px; }
/* 关于对话框 */
#about-dialog {
    display: none;
    position: fixed;
    z-index: 99999;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-elevated, #1c2333);
    border: 1px solid var(--border, rgba(48,54,61,0.6));
    border-radius: 12px;
    padding: 24px 32px;
    min-width: 320px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    text-align: center;
}
#about-dialog.show { display: block; }
#about-dialog .about-title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
#about-dialog .about-version { font-size: 13px; color: var(--accent); margin-bottom: 16px; }
#about-dialog .about-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px; }
#about-dialog .about-close { padding: 8px 24px; border: none; border-radius: 6px; background: var(--accent-gradient); color: #fff; font-size: 13px; cursor: pointer; }
#about-dialog .about-close:hover { box-shadow: var(--shadow-glow); transform: translateY(-1px); }

/* 主体行：viewbar | 内容区占位 | filebrowser */
#main-row {
    display: flex;
    flex: 1;
    min-height: 0;  /* 关键：允许子项缩小 */
    overflow: hidden;
}

/* 底部行：controlbar横跨全宽 */
#bottom-row {
    display: flex;
    height: 40px;
    flex-shrink: 0;
    overflow: hidden;
}

/* ==================== viewbar 区域 ==================== */
#viewbar {
    width: 60px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 2px 8px;
    gap: 2px;
    overflow-y: auto;
    overflow-x: hidden;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, transparent) 0%, color-mix(in srgb, var(--accent-2) 3%, transparent) 40%, transparent 80%), var(--bg-base);
}
/* viewbar 不再有自己的标题栏，由 #titlebar-row 统一处理 */

.vb-group-label { font-size: 7px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.2px; margin: 4px 0 1px; width: 100%; text-align: center; font-weight: 600; flex-shrink: 0; }
.vb-view-btn { width: 48px; height: 38px; border: 2px solid transparent; border-radius: var(--radius-md); background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transition: all var(--transition-normal); position: relative; flex-shrink: 0; }
.vb-view-btn .icon { font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center; }
.vb-view-btn .icon img { width: 18px; height: 18px; object-fit: contain; }
.vb-view-btn .label { font-size: 8px; color: var(--text-secondary); line-height: 1; font-weight: 500; }
.vb-view-btn:hover { background: var(--accent-soft); transform: scale(1.04); }
.vb-view-btn.active { border-color: var(--accent); background: var(--accent-soft-strong); box-shadow: var(--shadow-glow); }
.vb-view-btn.active .label { color: var(--accent); font-weight: 600; }
.vb-view-btn .badge { position: absolute; top: -1px; right: -1px; width: 7px; height: 7px; border-radius: 50%; display: none; border: 1px solid var(--bg-base); }
.vb-view-btn .badge.on { display: block; }
.vb-view-btn .badge.ds-gen { background: var(--cyan); animation: vb-pulse 1s infinite; }
.vb-view-btn .badge.ds-gen.concurrent { background: #fb923c; }
.vb-view-btn .badge.qw-gen { background: var(--warning); animation: vb-pulse 1s infinite; }
.vb-sep { width: 28px; height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 3px 0; flex-shrink: 0; }
.vb-confirm-group { display: flex; flex-direction: column; gap: 2px; width: 100%; align-items: center; margin: 2px 0; flex-shrink: 0; }
.vb-confirm-btn { width: 48px; height: 24px; border: 1px solid var(--border); border-radius: 5px; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 9px; font-weight: 500; display: flex; align-items: center; justify-content: center; transition: all var(--transition-normal); }
.vb-confirm-btn:hover { border-color: var(--accent); color: var(--text-primary); background: var(--accent-soft); }
.vb-confirm-btn.on { border-color: var(--accent); background: var(--accent-soft-strong); color: var(--accent); }
.vb-confirm-btn.chevron { font-size: 11px; }
.vb-confirm-menu { display: none; flex-direction: column; gap: 2px; width: 100%; align-items: center; margin-top: 2px; }
.vb-confirm-menu.open { display: flex; }
.vb-tool-btn { width: 48px; height: 30px; border: none; border-radius: var(--radius-sm); background: var(--accent-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-secondary); transition: all var(--transition-normal); flex-shrink: 0; }
.vb-tool-btn:hover { background: var(--accent-soft-strong); color: var(--accent); }
.vb-tool-btn.hidden { display: none; }
.vb-theme-btn { width: 48px; height: 30px; border: none; border-radius: var(--radius-sm); background: transparent; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all var(--transition-normal); flex-shrink: 0; margin-top: auto; }
.vb-theme-btn:hover { background: var(--hover-overlay); transform: rotate(15deg) scale(1.1); }
@keyframes vb-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(0.85); } }

/* ==================== filebrowser 区域 ==================== */
#filebrowser {
    width: 350px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, transparent) 0%, color-mix(in srgb, var(--accent-2) 3%, transparent) 40%, transparent 80%), var(--bg-base);
    overflow: hidden;
}
/* filebrowser 不再有自己的标题栏，由 #titlebar-row 统一处理 */
.fb-header { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.fb-toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; flex-wrap: wrap; }
.fb-nav-btn { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); padding: 6px 12px; border-radius: var(--radius-md); cursor: pointer; font-size: 12px; font-weight: 500; white-space: nowrap; transition: all var(--transition-fast); flex-shrink: 0; }
.fb-nav-btn:hover { background: var(--bg-hover); border-color: var(--accent); }
.fb-path-input-bar { flex: 1; display: flex; gap: 6px; align-items: center; background: var(--bg-elevated); border: 1px solid var(--border); padding: 4px 10px; border-radius: var(--radius-md); min-width: 120px; }
.fb-path-input-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.fb-path-input { flex: 1; background: transparent; border: none; color: var(--text-primary); padding: 5px 4px; font-size: 12px; font-family: 'Cascadia Code','Fira Code',Consolas,monospace; outline: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-path-input::placeholder { color: var(--text-secondary); }
.fb-go-btn { background: var(--accent-gradient); border: none; color: #fff; padding: 4px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; font-weight: 600; transition: all var(--transition-fast); }
.fb-go-btn:hover { box-shadow: var(--shadow-glow); transform: translateY(-1px); }
.fb-search-input { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); padding: 6px 12px; border-radius: var(--radius-md); font-size: 12px; outline: none; width: 140px; transition: all var(--transition-normal); }
.fb-search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); width: 180px; }
.fb-search-input::placeholder { color: var(--text-secondary); }
.fb-breadcrumb { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; padding: 6px 16px; font-size: 12px; border-top: 1px solid var(--border-light); }
.fb-breadcrumb span { cursor: pointer; color: var(--text-secondary); padding: 2px 6px; border-radius: var(--radius-sm); transition: all var(--transition-fast); }
.fb-breadcrumb span:hover { background: var(--bg-hover); color: var(--accent); }
.fb-breadcrumb .sep { color: var(--text-muted); cursor: default; padding: 2px 2px; }
.fb-breadcrumb .sep:hover { background: transparent; color: var(--text-muted); }
.fb-status-bar { display: flex; align-items: center; gap: 12px; padding: 6px 16px; font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border-light); background: color-mix(in srgb, var(--bg-panel) 80%, transparent); }
.fb-status-bar .stats { margin-left: auto; }
.fb-sync-btn { cursor: pointer; font-size: 11px; padding: 2px 8px; border: 1px solid var(--accent); border-radius: 4px; color: var(--accent); user-select: none; white-space: nowrap; }
.fb-sync-btn:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
.fb-sync-progress { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.fb-list-container { flex: 1; overflow-y: auto; padding: 8px; }
/* 文件浏览器滚动条适配主题 */
.fb-list-container::-webkit-scrollbar { width: 5px; }
.fb-list-container::-webkit-scrollbar-track { background: transparent; }
.fb-list-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.fb-list-container::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
#status-text::-webkit-scrollbar { height: 3px; }
#status-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.fb-list-header { display: flex; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--border-light); font-size: 11px; color: var(--text-muted); font-weight: 600; }
.fb-list-header .h-icon { width: 36px; text-align: center; }
.fb-list-header .h-name { flex: 1; }
.fb-list-header .h-size { min-width: 55px; text-align: right; }
.fb-list-header .h-actions { width: 84px; text-align: right; }
.fb-file-item { display: flex; align-items: center; padding: 4px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background var(--transition-fast); }
.fb-file-item:hover { background: var(--bg-hover); }
.fb-file-item .f-icon { width: 36px; text-align: center; font-size: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.fb-file-item .f-icon .mdi { font-size: 18px; }
.f-icon.dir { color: #4338ca; }
.f-icon.python { color: #3776AB; }
.f-icon.cpp { color: #00599C; }
.f-icon.c { color: #A8B9CC; }
.f-icon.java { color: #f89820; }
.f-icon.js { color: #F7DF1E; }
.f-icon.ts { color: #3178C6; }
.f-icon.html { color: #E34F26; }
.f-icon.css { color: #1572B6; }
.f-icon.json { color: #cbcbcb; }
.f-icon.md { color: #083fa1; }
.f-icon.pdf { color: #E53E30; }
.f-icon.word { color: #2B579A; }
.f-icon.excel { color: #217346; }
.f-icon.ppt { color: #D24625; }
.f-icon.image { color: #8B5CF6; }
.f-icon.video { color: #EF4444; }
.f-icon.audio { color: #10B981; }
.f-icon.archive { color: #F59E0B; }
.f-icon.sql { color: #336791; }
.f-icon.go { color: #00ADD8; }
.f-icon.rs { color: #DEA584; }
.f-icon.php { color: #777BB4; }
.f-icon.rb { color: #CC342D; }
.f-icon.swift { color: #F05138; }
.f-icon.kt { color: #7F52FF; }
.f-icon.default { color: #6b7280; }
.fb-file-item .f-name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-file-item .f-size { min-width: 55px; text-align: right; font-size: 11px; color: var(--text-muted); }
.fb-file-item .f-actions { width: 84px; text-align: right; display: flex; gap: 2px; justify-content: flex-end; opacity: 0; transition: opacity var(--transition-fast); }
.fb-file-item:hover .f-actions { opacity: 1; }
.fb-file-item .f-action-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
.fb-file-item .f-action-btn:hover { background: var(--bg-active); color: var(--accent); }

/* ==================== controlbar 区域 ==================== */
#controlbar {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    font-size: 12px;
    overflow: hidden;
    background: var(--bg-gradient), var(--bg-base);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
}
#pause-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--success); background: var(--success); cursor: pointer; flex-shrink: 0; transition: all var(--transition-normal); position: relative; }
#pause-btn:hover { transform: scale(1.2); box-shadow: 0 0 0 4px rgba(63,185,80,0.15), 0 0 14px rgba(63,185,80,0.5); }
#pause-btn.paused { background: var(--danger); border-color: var(--danger); animation: cb-pulse-paused 2s var(--transition) infinite; }
#pause-btn::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border-radius: 2px; background: #fff; opacity: .9; }
#pause-btn.paused::after { width: 8px; height: 8px; border-radius: 1px; border-left: 3px solid #fff; border-right: 3px solid #fff; background: transparent; }
@keyframes cb-pulse-paused { 0%,100% { box-shadow: 0 0 0 0 rgba(248,81,73,0.45), var(--shadow-sm); } 50% { box-shadow: 0 0 0 6px rgba(248,81,73,0), var(--shadow-sm); } }
#stop-btn { padding: 4px 14px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; color: #fff; background: linear-gradient(135deg, var(--danger), #ff6b6b); font-weight: bold; white-space: nowrap; flex-shrink: 0; }
#stop-btn:disabled { opacity: .4; cursor: not-allowed; }
#status-text { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow-x: auto; overflow-y: hidden; white-space: nowrap; font-size: 11px; }
#status-main { flex-shrink: 0; font-size: 11px; color: var(--text-secondary); }
#status-main.generating { color: var(--cyan); }
#status-main.done { color: var(--success); }
#status-main.error { color: var(--danger); }
#status-text .status-item { flex-shrink: 0; padding: 2px 8px; border-radius: 4px; background: var(--surface-muted); color: var(--text-secondary); }
#status-text .status-item.tool { color: var(--cyan); }
#status-text .status-item.success { color: var(--success); }
#status-text .status-item.error { color: var(--danger); }
#debug-toggle { padding: 4px 8px; border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; color: var(--text-secondary); background: var(--surface-muted); flex-shrink: 0; }
#debug-toggle:hover { background: rgba(56,139,253,0.12); color: var(--accent); border-color: var(--accent); }
#debug-panel { display: none; flex: 1; min-width: 0; align-items: center; }
#debug-panel.open { display: flex; }
#debug-panel-inner { display: flex; align-items: center; gap: 6px; width: 100%; }
#debug-input { flex: 1; min-width: 0; height: 26px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-elevated); color: var(--text-primary); padding: 2px 8px; font-family: 'Consolas', monospace; font-size: 11px; outline: none; }
#debug-input:focus { border-color: var(--accent); }
#debug-run { padding: 4px 12px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; color: #fff; background: var(--accent-gradient); font-weight: bold; flex-shrink: 0; white-space: nowrap; }
#debug-run:disabled { opacity: .5; cursor: not-allowed; }
#debug-status { font-size: 10px; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; }
#debug-output { flex: 1; min-width: 0; height: 26px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-elevated); color: var(--text-primary); padding: 2px 8px; font-family: 'Consolas', monospace; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 20px; display: none; }
#debug-output.show { display: block; }
#debug-output.error { color: var(--danger); }
#update-progress-bar { display: none; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 8px; font-size: 10px; color: var(--text-secondary); }
#update-progress-bar.show { display: flex; }
#update-progress-track { width: 80px; height: 5px; border-radius: 3px; background: var(--surface-muted-strong); overflow: hidden; }
#update-progress-fill { width: 0%; height: 100%; background: var(--accent-gradient); border-radius: 3px; }
#update-progress-text { min-width: 28px; text-align: right; white-space: nowrap; }

/* 内容区占位（deepseek/qwen/agent BrowserView 叠在此区域上方） */
#content-spacer { flex: 1; min-width: 0; }

/* ==================== 响应式折叠 ==================== */
/* 窗口宽度 < 1000px：隐藏 filebrowser，内容区占满 */
@media (max-width: 1000px) {
    #filebrowser { display: none; }
}
/* 窗口宽度 < 700px：隐藏 viewbar 的工具/审核区域，只保留视图按钮 */
@media (max-width: 700px) {
    .vb-group-label:not(:first-child),
    .vb-sep,
    .vb-tool-btn,
    .vb-confirm-group,
    .vb-theme-btn { display: none; }
    #viewbar { width: 48px; }
}
/* 窗口宽度 < 500px：隐藏 viewbar 整个侧栏，只保留标题栏 */
@media (max-width: 500px) {
    #viewbar { display: none; }
    #titlebar-text { display: none; }  /* 标题文字也隐藏，只留图标和窗口按钮 */
}
</style>
</head>
<body>
<div id="app">
    <!-- 标题栏行（横跨全宽） -->
    <div id="titlebar-row">
        <img id="titlebar-icon" src="build/icon.ico" alt="">
        <span id="titlebar-text">DeepSeek Local Agent</span>
        <div id="menubar-btns"></div>
        <div id="win-ctrl-group">
            <button onclick="windowControl('minimize')" title="最小化"><svg viewBox="0 0 16 16"><rect x="2" y="7.5" width="12" height="1" rx="0.5"/></svg></button>
            <button onclick="windowControl('maximize')" title="最大化"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
            <button class="close" onclick="windowControl('close')" title="关闭"><svg viewBox="0 0 16 16"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06z"/></svg></button>
        </div>
    </div>

    <!-- 主体行 -->
    <div id="main-row">
        <!-- viewbar -->
        <div id="viewbar">
            <div class="vb-group-label">视图</div>
            <button class="vb-view-btn active" data-view="deepseek" onclick="switchView('deepseek')" title="DeepSeek"><span class="icon"><img src="build/deepseek.png" alt="DS"></span><span class="label">DS</span><span class="badge ds-gen" id="b-ds"></span></button>
            <button class="vb-view-btn" data-view="qwen" onclick="switchView('qwen')" title="Qwen"><span class="icon"><img src="build/qwen.png" alt="QW"></span><span class="label">QW</span><span class="badge qw-gen" id="b-qw"></span></button>
            <button class="vb-view-btn" data-view="agent" onclick="switchView('agent')" title="Agent"><span class="icon">🤖</span><span class="label">AG</span></button>
            <button class="vb-view-btn" data-view="follow" onclick="switchView('follow')" title="跟随"><span class="icon">👁</span><span class="label">FL</span></button>
            <div class="vb-sep"></div>
            <div class="vb-group-label">工具</div>
            <button class="vb-tool-btn" id="intro-btn" onclick="ipcRenderer.send('ctrl-show-intro')" title="查看使用说明">💡</button>
            <button class="vb-tool-btn" style="margin-top:4px;width:48px;height:32px;border:none;border-radius:6px;background:var(--accent-gradient);color:#fff;cursor:pointer;font-size:10px;font-weight:600;" onclick="ipcRenderer.send('ctrl-open-toolbox')" title="工具箱">箱</button>
            <div class="vb-sep"></div>
            <div class="vb-group-label">审核</div>
            <div class="vb-confirm-group">
                <button class="vb-confirm-btn on" id="confirm-current" data-mode="smart" onclick="toggleConfirmMenu()">智能</button>
                <div id="confirm-menu" class="vb-confirm-menu">
                    <button class="vb-confirm-btn" data-mode="smart" onclick="setConfirmMode('smart')">智能</button>
                    <button class="vb-confirm-btn" data-mode="strict" onclick="setConfirmMode('strict')">严格</button>
                    <button class="vb-confirm-btn" data-mode="loose" onclick="setConfirmMode('loose')">宽松</button>
                    <button class="vb-confirm-btn" data-mode="readonly" onclick="setConfirmMode('readonly')">只读</button>
                    <button class="vb-confirm-btn chevron" data-mode="custom" onclick="showCustomConfirmMode()">自定义</button>
                </div>
            </div>
            <button class="vb-theme-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
        </div>

        <!-- 内容区占位（BrowserView 叠在上方） -->
        <div id="content-spacer"></div>

        <!-- filebrowser -->
        <div id="filebrowser">
            <div class="fb-header">
                <div class="fb-toolbar">
                    <button id="fb-up" class="fb-nav-btn">⬆ 上级</button>
                    <button id="fb-refresh" class="fb-nav-btn">↻ 刷新</button>
                    <div class="fb-path-input-bar">
                        <input type="text" id="fb-path-input" class="fb-path-input" placeholder="输入路径后回车">
                        <button id="fb-go" class="fb-go-btn">跳转</button>
                    </div>
                    <input type="text" id="fb-search" class="fb-search-input" placeholder="搜索文件...">
                    <span id="fb-sync-btn" class="fb-sync-btn" style="display:none;" title="将公共技能同步到当前工作目录">同步技能</span>
                    <span id="fb-sync-progress" class="fb-sync-progress" style="display:none;"></span>
                </div>
                <div id="fb-breadcrumb" class="fb-breadcrumb"></div>
            </div>
            <div class="fb-list-container" id="fb-list"></div>
            <div class="fb-status-bar">
                <span id="fb-status">就绪</span>
                <span class="stats" id="fb-stats"></span>
                <span>根目录: <span id="fb-root">未打开</span></span>
            </div>
        </div>
    </div>

    <!-- 底部行：controlbar -->
    <div id="bottom-row">
        <div id="controlbar">
            <div id="pause-btn" onclick="togglePause()" title="点击暂停/恢复 Agent 操作"></div>
            <span id="status-text" class="idle"><span id="status-main">就绪</span></span>
            <button id="stop-btn" disabled onclick="doStop()">⏹ 停止</button>
            <button id="debug-toggle" onclick="toggleDebug()" title="通用调试">⚡</button>
            <div id="debug-panel">
                <div id="debug-panel-inner">
                    <input id="debug-input" placeholder='{"tool": "exec", "params": {"timeout": 60000}, "body": "echo hello"}' spellcheck="false">
                    <button id="debug-run" onclick="runDebug()" disabled>▶ 执行</button>
                    <span id="debug-status"></span>
                    <div id="debug-output"></div>
                </div>
            </div>
            <div id="update-progress-bar">
                <div id="update-progress-track"><div id="update-progress-fill"></div></div>
                <span id="update-progress-text">0%</span>
            </div>
        </div>
    </div>
</div>

<script>
const { ipcRenderer } = require('electron');
const path = require('path');

function windowControl(action) { ipcRenderer.send('titlebar-window-control', action); }

// ==================== viewbar 逻辑 ====================
var currentView = 'deepseek';
var currentConfirmMode = 'smart';
var currentTheme = 'dark';
var THEME_LIST = ['dark', 'light', 'ocean', 'desert', 'forest', 'sunset'];
var THEME_ICONS = { dark: '🌙', light: '☀️', ocean: '🌊', desert: '🏜️', forest: '🌲', sunset: '🌅' };

function switchView(view) {
    currentView = view;
    document.querySelectorAll('.vb-view-btn').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-view') === view); });
    document.getElementById('intro-btn').classList.toggle('hidden', view !== 'deepseek');
    ipcRenderer.send('ctrl-view-select', view);
}

var confirmMenuOpen = false;
function toggleConfirmMenu() { confirmMenuOpen = !confirmMenuOpen; document.getElementById('confirm-menu').classList.toggle('open', confirmMenuOpen); }
function setConfirmMode(mode) { currentConfirmMode = mode; updateConfirmUI(); ipcRenderer.send('ctrl-set-confirm-mode', mode); document.getElementById('confirm-menu').classList.remove('open'); confirmMenuOpen = false; }
function updateConfirmUI() {
    var btn = document.getElementById('confirm-current');
    var labels = { smart: '智能', strict: '严格', loose: '宽松', readonly: '只读', custom: '自定义' };
    var display = currentConfirmMode.indexOf('custom:') === 0 ? 'custom' : currentConfirmMode;
    btn.textContent = labels[display] || '智能';
    document.querySelectorAll('.vb-confirm-btn').forEach(function(b) {
        var bm = b.getAttribute('data-mode');
        if (bm === 'custom') b.classList.toggle('on', display === 'custom');
        else if (bm) b.classList.toggle('on', bm === display);
    });
}
function showCustomConfirmMode() {
    document.getElementById('confirm-menu').classList.remove('open'); confirmMenuOpen = false;
    // 简化：直接设为 custom 默认值
    setConfirmMode('custom:delete=1,exec=0,write=0,edit=0,mkdir=0');
}
function toggleTheme() {
    var idx = THEME_LIST.indexOf(currentTheme); if (idx < 0) idx = 0;
    currentTheme = THEME_LIST[(idx + 1) % THEME_LIST.length];
    document.getElementById('theme-btn').textContent = THEME_ICONS[currentTheme] || '🎨';
    ipcRenderer.send('ctrl-set-theme', currentTheme);
}

ipcRenderer.on('ctrl-viewbar-status', (event, data) => {
    if (data.currentView && data.currentView !== currentView) { currentView = data.currentView; document.querySelectorAll('.vb-view-btn').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-view') === currentView); }); document.getElementById('intro-btn').classList.toggle('hidden', currentView !== 'deepseek'); }
    if (data.confirmMode && data.confirmMode !== currentConfirmMode) { currentConfirmMode = data.confirmMode; updateConfirmUI(); }
    document.getElementById('b-ds').classList.toggle('on', data.dsState === 'generating');
    document.getElementById('b-ds').classList.toggle('concurrent', !!data.dsConcurrent);
    document.getElementById('b-qw').classList.toggle('on', data.qwenState === 'generating');
    if (data.theme && data.theme !== currentTheme) { currentTheme = data.theme; document.getElementById('theme-btn').textContent = THEME_ICONS[currentTheme] || '🎨'; }
});
ipcRenderer.on('ctrl-theme', (event, theme) => { currentTheme = theme; document.getElementById('theme-btn').textContent = THEME_ICONS[theme] || '🎨'; });
ipcRenderer.on('ctrl-skills-count', function(event, count) { document.getElementById('skills-btn').textContent = count > 0 ? '🧩(' + count + ')' : '🧩'; });
ipcRenderer.invoke('agent-skills-load').then(function(res) { if (res && res.success && res.skills) { document.getElementById('skills-btn').textContent = res.skills.length > 0 ? '🧩(' + res.skills.length + ')' : '🧩'; } }).catch(function() {});
ipcRenderer.invoke('agent-config-load').then(function(res) { if (res.success && res.config && res.config.confirmMode) { currentConfirmMode = res.config.confirmMode; updateConfirmUI(); } }).catch(function() {});

// ==================== 菜单栏逻辑（使用原生 Menu.popup，避免被 BrowserView 遮挡） ====================
var menuConfig = null;
var activeMenuBtn = null;
var menuOverlay = null;

async function loadMenubarConfig() {
    try {
        var res = await ipcRenderer.invoke('get-menubar-config');
        if (res.success && res.config) { menuConfig = res.config; renderMenubar(res.config); }
    } catch (e) { console.error('[Menubar] Load error:', e); }
}

function renderMenubar(config) {
    var container = document.getElementById('menubar-btns');
    if (!container) return;
    container.innerHTML = '';
    (config.menu || []).forEach(function(m) {
        var btn = document.createElement('button');
        btn.className = 'mb-btn'; btn.dataset.menuId = m.id; btn.textContent = m.label;
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            // 通过主进程在当前可见的 BrowserView 中注入菜单 overlay（避免被其他 BrowserView 遮挡）
            var rect = btn.getBoundingClientRect();
            ipcRenderer.send('inject-menu-overlay', { menuId: m.id, left: rect.left, bottom: rect.bottom });
        });
        container.appendChild(btn);
    });
}

function showCustomMenu(btn, menuData) {
    if (!menuOverlay) {
        menuOverlay = document.getElementById('titlebar-menu-overlay');
        if (!menuOverlay) {
            menuOverlay = document.createElement('div');
            menuOverlay.id = 'titlebar-menu-overlay';
            document.body.appendChild(menuOverlay);
        }
    }
    // 如果点击同一个按钮，关闭菜单
    if (activeMenuBtn === btn && menuOverlay.style.display !== 'none') {
        hideCustomMenu();
        return;
    }
    activeMenuBtn = btn;
    // 渲染菜单项
    var html = '';
    (menuData.items || []).forEach(function(item) {
        if (item.type === 'separator') {
            html += '<div class="menu-sep"></div>';
        } else {
            var cls = 'menu-item';
            if (item.type === 'radio') {
                var checked = (item.theme && item.theme === (window.currentTheme || 'dark'));
                html += '<div class="' + cls + '" data-action="' + (item.action || '') + '" data-theme="' + (item.theme || '') + '" data-role="' + (item.role || '') + '">'
                    + '<span><span class="menu-radio ' + (checked ? 'checked' : '') + '"></span>' + item.label + '</span>'
                    + (item.accelerator ? '<span class="menu-accel">' + item.accelerator + '</span>' : '')
                    + '</div>';
            } else {
                html += '<div class="' + cls + '" data-action="' + (item.action || '') + '" data-id="' + (item.id || '') + '" data-role="' + (item.role || '') + '">'
                    + '<span>' + item.label + '</span>'
                    + (item.accelerator ? '<span class="menu-accel">' + item.accelerator + '</span>' : '')
                    + '</div>';
            }
        }
    });
    menuOverlay.innerHTML = html;
    // 定位：菜单按钮下方
    var rect = btn.getBoundingClientRect();
    menuOverlay.style.left = rect.left + 'px';
    menuOverlay.style.top = rect.bottom - 4 + 'px';
    menuOverlay.style.display = 'block';
    // 绑定点击事件
    menuOverlay.querySelectorAll('.menu-item').forEach(function(mi) {
        mi.addEventListener('click', function(e) {
            e.stopPropagation();
            var action = mi.dataset.action;
            var theme = mi.dataset.theme;
            var role = mi.dataset.role;
            var id = mi.dataset.id;
            hideCustomMenu();
            if (action === 'about') {
                showAboutDialog();
            } else if (action === 'theme') {
                ipcRenderer.send('set-theme', theme);
                window.currentTheme = theme;
            } else if (role) {
                ipcRenderer.send('menu-role-action', role);
            } else if (action) {
                ipcRenderer.send('menu-action', action);
            }
        });
    });
    // 点击外部关闭
    document.addEventListener('click', hideCustomMenuOnOutside, true);
}

function hideCustomMenuOnOutside(e) {
    if (!menuOverlay || menuOverlay.style.display === 'none') return;
    if (!menuOverlay.contains(e.target) && (!activeMenuBtn || !activeMenuBtn.contains(e.target))) {
        hideCustomMenu();
    }
}

function hideCustomMenu() {
    if (menuOverlay) menuOverlay.style.display = 'none';
    activeMenuBtn = null;
    document.removeEventListener('click', hideCustomMenuOnOutside, true);
}

// 关于对话框
var aboutDialog = null;
function showAboutDialog() {
    if (!aboutDialog) {
        aboutDialog = document.createElement('div');
        aboutDialog.id = 'about-dialog';
        aboutDialog.innerHTML = 
            '<div class="about-title">DS Agent Desktop</div>'
            + '<div class="about-version">版本 5.0.5</div>'
            + '<div class="about-desc">基于 Electron + DeepSeek + Qwen<br>本地工具系统支持文件操作、代码执行、窗口管理等功能。</div>'
            + '<button class="about-close">关闭</button>';
        aboutDialog.querySelector('.about-close').addEventListener('click', hideAboutDialog);
        document.body.appendChild(aboutDialog);
    }
    aboutDialog.classList.add('show');
    aboutDialog.style.display = 'block';
}

function hideAboutDialog() {
    if (aboutDialog) {
        aboutDialog.classList.remove('show');
        aboutDialog.style.display = 'none';
    }
}

// 主题同步
ipcRenderer.on('shell-inject-theme', function(event, data) {
    window.currentTheme = data.theme || 'dark';
});

setTimeout(loadMenubarConfig, 200);

// ==================== controlbar 逻辑 ====================
var isPaused = false;
function togglePause() { isPaused = !isPaused; document.getElementById('pause-btn').classList.toggle('paused', isPaused); ipcRenderer.send('ctrl-toggle-autoexec', !isPaused); }
function doStop() { ipcRenderer.send('ctrl-stop'); document.getElementById('stop-btn').disabled = true; document.getElementById('stop-btn').textContent = '⏹ 停止中'; }

ipcRenderer.on('ctrl-status', (event, data) => {
    if (data.buttonState) { var isGen = data.buttonState === 'generating'; document.getElementById('stop-btn').disabled = !isGen; document.getElementById('stop-btn').textContent = isGen ? '⏹ 停止' : '⏹'; }
    var text = '', cls = '';
    switch (data.buttonState) { case 'generating': text = 'DeepSeek 正在输出...'; cls = 'generating'; break; case 'done': text = '对话完成 ✓'; cls = 'done'; break; case 'sending': text = '正在发送...'; cls = 'generating'; break; case 'ready': text = '就绪'; break; default: text = data.statusText || '就绪'; }
    if (data.qwenState === 'generating') { text = 'Qwen 正在输出...'; cls = 'generating'; }
    var mainEl = document.getElementById('status-main'); if (mainEl) { mainEl.textContent = text; mainEl.className = cls; }
});
ipcRenderer.on('ctrl-notify', (event, msg) => { addStatusItem(msg, 'success', 3000); });
ipcRenderer.on('ctrl-agent-status', (event, data) => { var msg = data.msg || data || ''; if (typeof msg === 'string' && msg) addStatusItem(msg, data.type || 'tool', 10000); });
function addStatusItem(text, type, timeout) {
    if (!text || text === '就绪') return;
    var container = document.getElementById('status-text');
    var el = document.createElement('span'); el.className = 'status-item' + (type ? ' ' + type : ''); el.textContent = text;
    container.appendChild(el); container.scrollLeft = container.scrollWidth;
    setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { if (el.parentNode) el.remove(); }, 400); }, timeout || 10000);
}
var updateProgressTimer = null;
ipcRenderer.on('ctrl-update-progress', function(event, data) {
    document.getElementById('update-progress-bar').classList.add('show');
    document.getElementById('update-progress-fill').style.width = data.percent + '%';
    document.getElementById('update-progress-text').textContent = data.percent + '%';
    if (updateProgressTimer) clearTimeout(updateProgressTimer);
    updateProgressTimer = setTimeout(function() { document.getElementById('update-progress-bar').classList.remove('show'); }, 8000);
});
ipcRenderer.on('ctrl-update-done', function() {
    document.getElementById('update-progress-fill').style.width = '100%';
    document.getElementById('update-progress-text').textContent = '100%';
    setTimeout(function() { document.getElementById('update-progress-bar').classList.remove('show'); }, 2000);
});

// 调试面板
var debugOpen = false, debugRunning = false;
var debugInput = document.getElementById('debug-input');
var debugRunBtn = document.getElementById('debug-run');
var debugOutput = document.getElementById('debug-output');
var debugStatus = document.getElementById('debug-status');
debugInput.addEventListener('input', function() { debugRunBtn.disabled = !this.value.trim(); });
debugInput.addEventListener('keydown', function(e) { if (e.ctrlKey && e.key === 'Enter' && !debugRunBtn.disabled && !debugRunning) runDebug(); });
function toggleDebug() { debugOpen = !debugOpen; document.getElementById('debug-panel').classList.toggle('open', debugOpen); document.getElementById('status-text').style.display = debugOpen ? 'none' : ''; document.getElementById('stop-btn').style.display = debugOpen ? 'none' : ''; if (debugOpen) debugInput.focus(); }
async function runDebug() {
    if (debugRunning) return; var raw = debugInput.value.trim(); if (!raw) return;
    debugRunning = true; debugRunBtn.disabled = true; debugRunBtn.textContent = '⏳'; debugStatus.textContent = '执行中...'; debugOutput.classList.remove('show', 'error'); debugOutput.textContent = '';
    try {
        var payload; try { payload = JSON.parse(raw); } catch(e) { return showDebugError('JSON 解析失败: ' + e.message); }
        var result = await ipcRenderer.invoke('agent-tool', payload);
        var outStr = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
        if (outStr.length > 500) { ipcRenderer.send('ctrl-debug-log', outStr); debugOutput.textContent = '结果已输出到终端 (' + outStr.length + ' 字符)'; } else { debugOutput.textContent = outStr; }
        debugOutput.classList.add('show');
        if (result && (result.success || result.error === undefined)) { debugStatus.textContent = '✓'; debugStatus.style.color = '#34d399'; } else { debugStatus.textContent = '✗'; debugStatus.style.color = '#ef4444'; debugOutput.classList.add('error'); }
    } catch(e) { showDebugError(e.message); } finally { debugRunning = false; debugRunBtn.textContent = '▶'; debugRunBtn.disabled = !debugInput.value.trim(); }
}
function showDebugError(msg) { debugOutput.textContent = msg; debugOutput.classList.add('show', 'error'); debugStatus.textContent = '✗'; debugStatus.style.color = '#ef4444'; debugRunning = false; debugRunBtn.textContent = '▶'; debugRunBtn.disabled = false; }

// ==================== filebrowser 逻辑 ====================
var currentDir = '';
var currentRoot = null;
var lastLoadedFiles = [];
var lastLoadedDir = '';
var autoRefreshTimer = null;
var lastRenderedSnapshot = '';

function pathJoin(...parts) { return parts.join('\\').replace(/\\\\/g, '\\').replace(/\//g, '\\'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39'}[c]; }); }

function getFileIcon(filename, isDir) {
    if (isDir) return { icon: 'mdi-folder', cls: 'dir' };
    var ext = filename.split('.').pop().toLowerCase();
    var map = {
        js:{icon:'mdi-language-javascript',cls:'js'}, jsx:{icon:'mdi-language-javascript',cls:'js'},
        ts:{icon:'mdi-language-typescript',cls:'ts'}, tsx:{icon:'mdi-language-typescript',cls:'ts'},
        py:{icon:'mdi-language-python',cls:'python'}, java:{icon:'mdi-language-java',cls:'java'},
        cpp:{icon:'mdi-language-cpp',cls:'cpp'}, c:{icon:'mdi-language-c',cls:'c'},
        h:{icon:'mdi-language-c',cls:'c'}, hpp:{icon:'mdi-language-cpp',cls:'cpp'},
        cs:{icon:'mdi-language-csharp',cls:'cpp'}, go:{icon:'mdi-language-go',cls:'go'},
        rs:{icon:'mdi-language-rust',cls:'rs'}, php:{icon:'mdi-language-php',cls:'php'},
        rb:{icon:'mdi-language-ruby',cls:'rb'}, swift:{icon:'mdi-language-swift',cls:'swift'},
        kt:{icon:'mdi-language-kotlin',cls:'kt'},
        html:{icon:'mdi-language-html5',cls:'html'}, htm:{icon:'mdi-language-html5',cls:'html'},
        css:{icon:'mdi-language-css3',cls:'css'}, scss:{icon:'mdi-language-css3',cls:'css'},
        json:{icon:'mdi-code-json',cls:'json'}, xml:{icon:'mdi-file-code',cls:'json'},
        yaml:{icon:'mdi-file-code',cls:'json'}, yml:{icon:'mdi-file-code',cls:'json'},
        sql:{icon:'mdi-database',cls:'sql'}, db:{icon:'mdi-database',cls:'sql'},
        md:{icon:'mdi-language-markdown',cls:'md'}, txt:{icon:'mdi-file-document',cls:'default'},
        pdf:{icon:'mdi-file-pdf-box',cls:'pdf'},
        doc:{icon:'mdi-file-word-box',cls:'word'}, docx:{icon:'mdi-file-word-box',cls:'word'},
        xls:{icon:'mdi-file-excel-box',cls:'excel'}, xlsx:{icon:'mdi-file-excel-box',cls:'excel'},
        ppt:{icon:'mdi-file-powerpoint-box',cls:'ppt'}, pptx:{icon:'mdi-file-powerpoint-box',cls:'ppt'},
        jpg:{icon:'mdi-file-image',cls:'image'}, jpeg:{icon:'mdi-file-image',cls:'image'},
        png:{icon:'mdi-file-image',cls:'image'}, gif:{icon:'mdi-file-image',cls:'image'},
        svg:{icon:'mdi-file-image',cls:'image'}, webp:{icon:'mdi-file-image',cls:'image'},
        ico:{icon:'mdi-file-image',cls:'image'}, bmp:{icon:'mdi-file-image',cls:'image'},
        mp3:{icon:'mdi-file-music',cls:'audio'}, wav:{icon:'mdi-file-music',cls:'audio'},
        flac:{icon:'mdi-file-music',cls:'audio'}, ogg:{icon:'mdi-file-music',cls:'audio'},
        mp4:{icon:'mdi-file-video',cls:'video'}, avi:{icon:'mdi-file-video',cls:'video'},
        mkv:{icon:'mdi-file-video',cls:'video'}, mov:{icon:'mdi-file-video',cls:'video'},
        zip:{icon:'mdi-folder-zip',cls:'archive'}, rar:{icon:'mdi-folder-zip',cls:'archive'},
        '7z':{icon:'mdi-folder-zip',cls:'archive'}, tar:{icon:'mdi-folder-zip',cls:'archive'}, gz:{icon:'mdi-folder-zip',cls:'archive'},
        exe:{icon:'mdi-application',cls:'default'}, dll:{icon:'mdi-application',cls:'default'},
        bat:{icon:'mdi-console',cls:'default'}, sh:{icon:'mdi-console',cls:'default'}, cmd:{icon:'mdi-console',cls:'default'},
        log:{icon:'mdi-file-document',cls:'default'}, cfg:{icon:'mdi-file-cog',cls:'default'},
        ini:{icon:'mdi-file-cog',cls:'default'}, env:{icon:'mdi-file-lock',cls:'default'}
    };
    return map[ext] || { icon: 'mdi-file', cls: 'default' };
}

function formatSize(bytes) { if (!bytes) return '0 B'; var units = ['B','KB','MB','GB']; var i = 0; while (bytes >= 1024 && i < units.length-1) { bytes /= 1024; i++; } return bytes.toFixed(i === 0 ? 0 : 1) + ' ' + units[i]; }

function updateBreadcrumb(dirPath) {
    var container = document.getElementById('fb-breadcrumb');
    var parts = dirPath.split('\\');
    container.innerHTML = '';
    var current = '';
    parts.forEach(function(part, index) {
        if (index > 0) {
            var sep = document.createElement('span');
            sep.className = 'sep';
            sep.innerText = ' › ';
            container.appendChild(sep);
        }
        var crumb = document.createElement('span');
        crumb.innerText = part || (part === '' ? '根' : part);
        if (index < parts.length - 1) {
            current += (current ? '\\' : '') + part;
            crumb.onclick = function() { loadDir(current); };
        }
        container.appendChild(crumb);
    });
}

function updateStats(files) {
    var dirs = files.filter(function(f) { return f.isDir; }).length;
    var filesCount = files.length - dirs;
    document.getElementById('fb-stats').innerText = dirs + ' 目录, ' + filesCount + ' 文件';
}

function showEmpty(icon, title, subtitle) {
    var container = document.getElementById('fb-list');
    container.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;color:var(--text-muted);">'
        + '<div style="font-size:40px;margin-bottom:12px;">' + icon + '</div>'
        + '<div style="font-size:14px;color:var(--text-secondary);margin-bottom:4px;">' + title + '</div>'
        + (subtitle ? '<div style="font-size:12px;color:var(--text-muted);">' + subtitle + '</div>' : '')
        + '</div>';
}

function getFileListSnapshot(files) {
    return (files || []).map(function(f) { return f.name + '|' + (f.isDir ? 'D' : 'F') + '|' + f.size + '|' + f.modifiedTime; }).sort().join(',');
}

async function refreshIfChanged() {
    if (!currentDir || !currentRoot) return;
    try {
        var result = await ipcRenderer.invoke('list-dir', currentDir);
        if (!result.success) return;
        var snapshot = getFileListSnapshot(result.files);
        if (snapshot !== lastRenderedSnapshot) {
            lastRenderedSnapshot = snapshot;
            currentDir = result.path;
            lastLoadedFiles = result.files;
            lastLoadedDir = result.path;
            document.getElementById('fb-path-input').value = currentDir;
            document.getElementById('fb-root').innerText = currentRoot;
            applySearchFilter();
            document.getElementById('fb-status').innerText = '已加载 ' + result.files.length + ' 个项目';
        }
    } catch(e) {}
}

function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(refreshIfChanged, 5000);
}

function applySearchFilter() {
    var query = document.getElementById('fb-search').value.trim().toLowerCase();
    if (!query) {
        renderFileList(lastLoadedFiles, lastLoadedDir);
        document.getElementById('fb-status').innerText = '已加载 ' + lastLoadedFiles.length + ' 个项目';
    } else {
        var filtered = lastLoadedFiles.filter(function(f) { return f.name.toLowerCase().includes(query); });
        renderFileList(filtered, lastLoadedDir);
        document.getElementById('fb-status').innerText = '找到 ' + filtered.length + ' 个结果 (共 ' + lastLoadedFiles.length + ' 个)';
    }
}

// 排序辅助：文件夹优先，同类型按名称排序
function sortFiles(files) {
    return [].concat(files).sort(function(a, b) {
        if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
        return a.name.localeCompare(b.name);
    });
}

function renderFileList(files, dirPath) {
    var container = document.getElementById('fb-list');
    if (!files || files.length === 0) {
        showEmpty('📂', '此文件夹为空', '');
        return;
    }
    // 排序：文件夹排在文件前面，各自按名称排序
    var sorted = [].concat(files).sort(function(a, b) {
        if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
        return a.name.localeCompare(b.name);
    });
    var html = '<div class="fb-list-header"><div class="h-icon"></div><div class="h-name">名称</div><div class="h-size">大小</div><div class="h-actions">操作</div></div>';
    sorted.forEach(function(file) {
        var fullPath = pathJoin(currentDir, file.name);
        var iconInfo = getFileIcon(file.name, file.isDir);
        var sizeStr = file.isDir ? '' : formatSize(file.size);
        html += '<div class="fb-file-item" draggable="true" data-name="' + escapeHtml(file.name) + '" data-path="' + escapeHtml(fullPath) + '">'
            + '<div class="f-icon ' + iconInfo.cls + '"><span class="mdi ' + iconInfo.icon + '"></span></div>'
            + '<div class="f-name">' + escapeHtml(file.name) + '</div>'
            + '<div class="f-size">' + sizeStr + '</div>'
            + '<div class="f-actions">';
        if (!file.isDir) html += '<button class="f-action-btn" data-act="chat" title="发送到对话">→</button>';
        html += '<button class="f-action-btn" data-act="rename" title="重命名">✎</button>'
            + '<button class="f-action-btn" data-act="del" title="删除">✕</button>'
            + '</div></div>';
    });
    container.innerHTML = html;
    container.querySelectorAll('.fb-file-item').forEach(function(item) {
        var name = item.dataset.name;
        var file = sorted.find(function(f) { return f.name === name; });
        if (!file) return;
        var fullPath = pathJoin(currentDir, file.name);
        // 拖拽
        item.addEventListener('dragstart', function(e) {
            e.dataTransfer.setData('text/plain', fullPath);
            e.dataTransfer.effectAllowed = 'copy';
        });
        // 双击打开
        item.ondblclick = function() {
            if (file.isDir) loadDir(fullPath);
            else ipcRenderer.invoke('open-file', fullPath);
        };
        // 操作按钮
        item.querySelectorAll('.f-action-btn').forEach(function(btn) {
            btn.onclick = function(e) {
                e.stopPropagation();
                var act = btn.dataset.act;
                if (act === 'chat') ipcRenderer.invoke('send-path-to-chat', fullPath);
                else if (act === 'delete' || act === 'del') {
                    ipcRenderer.invoke('fb-confirm-file-delete', file.name).then(function(res) {
                        if (res && res.confirmed) {
                            ipcRenderer.invoke('delete-file', fullPath, file.isDir).then(function() { loadDir(currentDir); });
                        }
                    });
                } else if (act === 'rename') {
                    var nameEl = item.querySelector('.f-name');
                    var oldName = nameEl.textContent;
                    var input = document.createElement('input');
                    input.type = 'text';
                    input.value = oldName;
                    input.style.cssText = 'background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--accent);outline:none;padding:2px 6px;font-size:13px;font-family:inherit;border-radius:4px;width:100%;box-sizing:border-box;';
                    nameEl.textContent = '';
                    nameEl.appendChild(input);
                    input.focus();
                    input.select();
                    function finishRename() {
                        var newName = input.value.trim();
                        input.remove();
                        nameEl.textContent = oldName;
                        if (newName && newName !== oldName) {
                            ipcRenderer.invoke('rename-file', fullPath, newName).then(function(res) {
                                if (res.success) loadDir(currentDir);
                                else alert('重命名失败: ' + (res.error || '未知错误'));
                            });
                        }
                    }
                    input.addEventListener('keydown', function(ke) {
                        if (ke.key === 'Enter') { ke.preventDefault(); finishRename(); }
                        if (ke.key === 'Escape') { input.remove(); nameEl.textContent = oldName; }
                    });
                    input.addEventListener('blur', finishRename);
                }
            };
        });
    });
}

async function loadDir(dirPath) {
    if (!currentRoot) {
        showEmpty('📂', '请先选择根目录', '通过菜单 文件 > 打开文件夹 选择');
        document.getElementById('fb-status').innerText = '未打开文件夹';
        return;
    }
    showEmpty('⏳', '加载中...', '');
    document.getElementById('fb-status').innerText = '正在加载 ' + dirPath;
    try {
        var result = await ipcRenderer.invoke('list-dir', dirPath);
        if (result.success) {
            currentDir = result.path;
            lastLoadedFiles = result.files;
            lastLoadedDir = result.path;
            lastRenderedSnapshot = getFileListSnapshot(result.files);
            document.getElementById('fb-path-input').value = currentDir;
            document.getElementById('fb-root').innerText = currentRoot;
            updateBreadcrumb(currentDir);
            updateStats(result.files);
            applySearchFilter();
            document.getElementById('fb-status').innerText = '已加载 ' + result.files.length + ' 个项目';
        } else {
            showEmpty('⚠️', '加载失败', result.error);
            document.getElementById('fb-status').innerText = '加载失败';
        }
    } catch(err) {
        showEmpty('⚠️', '错误', err.message);
    }
}

// 按钮事件
document.getElementById('fb-up').onclick = function() {
    if (!currentRoot) return;
    // 检查是否已到根目录，防止退出
    var normCurrent = currentDir.replace(/\//g, '\\').replace(/\\+$/g, '');
    var normRoot = currentRoot.replace(/\//g, '\\').replace(/\\+$/g, '');
    if (normCurrent === normRoot) {
        document.getElementById('fb-status').innerText = '已在根目录';
        return;
    }
    // 用反斜杠 split，兼容所有路径格式
    var parts = normCurrent.split('\\');
    parts.pop();
    var parent = parts.join('\\');
    // 如果 parent 为空（到了盘符根比如 D:），回退到根目录
    if (!parent || parent === '') parent = normRoot;
    loadDir(parent);
};
document.getElementById('fb-refresh').onclick = function() { if (currentDir) loadDir(currentDir); };
document.getElementById('fb-go').onclick = function() {
    var newPath = document.getElementById('fb-path-input').value;
    if (newPath) loadDir(newPath);
};
document.getElementById('fb-path-input').onkeypress = function(e) { if (e.key === 'Enter') document.getElementById('fb-go').click(); };
document.getElementById('fb-search').addEventListener('input', applySearchFilter);

// 同步技能按钮
document.getElementById('fb-sync-btn').addEventListener('click', function() {
    var btn = this;
    var progress = document.getElementById('fb-sync-progress');
    btn.style.display = 'none';
    progress.style.display = '';
    progress.innerText = '正在同步...';
    ipcRenderer.send('sync-skills-start');
});
ipcRenderer.on('sync-skills-progress', function(event, data) {
    var progress = document.getElementById('fb-sync-progress');
    var btn = document.getElementById('fb-sync-btn');
    if (data.status === 'done') {
        progress.innerText = '✅ 同步完成';
        setTimeout(function() { progress.style.display = 'none'; }, 3000);
    } else if (data.status === 'error') {
        progress.innerText = '❌ ' + (data.message || '同步失败');
        setTimeout(function() { progress.style.display = 'none'; btn.style.display = ''; }, 3000);
    } else {
        progress.innerText = data.message || '同步中...';
    }
});

// root-changed 事件
ipcRenderer.on('root-changed', function(event, newRoot) {
    currentRoot = newRoot;
    var syncBtn = document.getElementById('fb-sync-btn');
    var progress = document.getElementById('fb-sync-progress');
    if (newRoot) {
        syncBtn.style.display = '';
        progress.style.display = 'none';
        loadDir(newRoot);
    } else {
        currentDir = '';
        syncBtn.style.display = 'none';
        progress.style.display = 'none';
        showEmpty('📂', '请先选择根目录', '通过菜单 文件 > 打开文件夹 选择');
        document.getElementById('fb-status').innerText = '文件夹已关闭';
        document.getElementById('fb-path-input').value = '';
        document.getElementById('fb-breadcrumb').innerHTML = '';
        document.getElementById('fb-stats').innerText = '';
        document.getElementById('fb-root').innerText = '未打开';
    }
});

// 主题
ipcRenderer.on('fb-theme', function(event, theme) { document.body.classList.toggle('light', theme === 'light'); });

// 启动自动刷新
startAutoRefresh();


// ==================== 主题注入 ====================
ipcRenderer.on('shell-inject-theme', (event, data) => {
    var existing = document.getElementById('__theme_preset');
    if (data.css) {
        if (!existing) { existing = document.createElement('style'); existing.id = '__theme_preset'; document.head.appendChild(existing); }
        existing.textContent = data.css;
        document.body.classList.remove('light');
    } else {
        if (existing) existing.remove();
        document.body.classList.toggle('light', data.theme === 'light');
    }
});
ipcRenderer.on('fb-theme', (event, theme) => { /* CSS 变量统一由 shell-inject-theme 处理 */ });
</script>
