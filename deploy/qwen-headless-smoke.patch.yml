# Minimal overlay for exercising Qwen through a real one-shot DSH Agent.
# The runtime bearer token is supplied through WEBAGENT_DSH_TOKEN; no secret is
# stored here. This intentionally omits the WebAgent tool plugin so the smoke
# task uses DSH's own Agent loop and built-in workspace tools.

- id: llm-pi-ai
  config:
    providers:
      webagent:
        displayName: WebAgent - Qwen Agent Smoke
        apiKeyEnv: WEBAGENT_DSH_TOKEN
        api: openai-completions
        baseURL: http://127.0.0.1:5858/api.openai.com/v1
        headers:
          X-WebAgent-Agent-Mode: 'false'
          X-WebAgent-Tool-Bridge: dsh
        cacheRetention: short
        reasoning: 'off'
        compat:
          thinkingFormat: deepseek
          supportsReasoningEffort: true
          supportsUsageInStreaming: true
        defaultContextWindow: 256000
        defaultMaxTokens: 32768
        models:
          - id: qwen.text.web.3.8-max
            name: Qwen3.8-Max - Web
            input: [text, image]
            contextWindow: 256000
            maxTokens: 32768
            reasoningEfforts:
              'off': none
              low: low
              high: high

- id: agent-default-model
  config:
    provider: webagent
    model: qwen.text.web.3.8-max
