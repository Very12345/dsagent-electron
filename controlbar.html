<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-base: #0d1117;
    --bg-elevated: #161b22;
    --border: rgba(48,54,61,0.6);
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #388bfd;
    --accent-2: #8957e5;
    --accent-gradient: linear-gradient(135deg, #388bfd, #8957e5);
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
    --cyan: #22d3ee;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
    --shadow-glow: 0 0 12px rgba(56,139,253,0.3);
    --radius-sm: 6px;
    --radius-md: 8px;
    --transition: cubic-bezier(0.4, 0, 0.2, 1);
    --transition-fast: 0.15s var(--transition);
    --transition-normal: 0.25s var(--transition);
    --bg-gradient: linear-gradient(180deg, color-mix(in srgb, var(--accent) 3%, transparent) 0%, transparent 100%);
    --surface-muted: rgba(255,255,255,0.06);
    --surface-muted-strong: rgba(255,255,255,0.1);
}

body.light {
    --bg-base: #ffffff;
    --bg-elevated: #f6f8fa;
    --border: #d0d7de;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --text-muted: #8c959f;
    --accent: #0969da;
    --accent-2: #8250df;
    --accent-gradient: linear-gradient(135deg, #0969da, #8250df);
    --success: #1a7f37;
    --danger: #cf222e;
    --warning: #9a6700;
    --cyan: #0969da;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-glow: 0 0 12px rgba(9,105,218,0.15);
    --bg-gradient: linear-gradient(180deg, color-mix(in srgb, var(--accent) 3%, transparent) 0%, transparent 100%);
    --surface-muted: rgba(0,0,0,0.05);
    --surface-muted-strong: rgba(0,0,0,0.08);
}

body {
    font-family: system-ui, 'Segoe UI', sans-serif;
    background: var(--bg-gradient), var(--bg-base);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    font-size: 12px;
    overflow: hidden;
    position: relative;
    border-top: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
}

/* 暂停/连接状态按钮 */
#pause-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--success);
    background: var(--success);
    cursor: pointer;
    flex-shrink: 0;
    transition: transform var(--transition-normal), box-shadow var(--transition-normal), background var(--transition-normal), border-color var(--transition-normal);
    position: relative;
    box-shadow: var(--shadow-sm);
}
#pause-btn:hover {
    transform: scale(1.2);
    box-shadow: 0 0 0 4px rgba(63,185,80,0.15), 0 0 14px rgba(63,185,80,0.5);
}
#pause-btn.paused {
    background: var(--danger);
    border-color: var(--danger);
    animation: pulse-paused 2s var(--transition) infinite;
}
#pause-btn.paused:hover {
    animation: none;
    box-shadow: 0 0 0 4px rgba(248,81,73,0.15), 0 0 14px rgba(248,81,73,0.55);
}

@keyframes pulse-paused {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,81,73,0.45), var(--shadow-sm); }
    50% { box-shadow: 0 0 0 6px rgba(248,81,73,0), var(--shadow-sm); }
}

/* 状态灯内部图标 */
#pause-btn::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px;
    border-radius: 2px;
    background: #fff;
    opacity: .9;
    transition: all var(--transition-fast);
}
#pause-btn.paused::after {
    width: 8px;
    height: 8px;
    border-radius: 1px;
    border-left: 3px solid #fff;
    border-right: 3px solid #fff;
    background: transparent;
}

/* 停止按钮 */
#stop-btn {
    padding: 4px 14px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    color: #fff;
    background: linear-gradient(135deg, var(--danger), #ff6b6b);
    font-weight: bold;
    white-space: nowrap;
    transition: opacity var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
    flex-shrink: 0;
    box-shadow: var(--shadow-sm), 0 1px 4px rgba(248,81,73,0.3);
}
#stop-btn:hover:not(:disabled) {
    opacity: .92;
    box-shadow: var(--shadow-md), 0 2px 10px rgba(248,81,73,0.4);
}
#stop-btn:active { transform: scale(0.95); }
#stop-btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

/* 状态文字 - 滚动容器 */
#status-text {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    scrollbar-width: thin;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0.2px;
}
#status-text::-webkit-scrollbar { height: 2px; }
#status-text::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 1px; }
#status-main {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-secondary);
    transition: color var(--transition-normal);
}
#status-main.generating { color: var(--cyan); }
#status-main.done { color: var(--success); }
#status-main.error { color: var(--danger); }
#status-text .status-item {
    flex-shrink: 0;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface-muted);
    color: var(--text-secondary);
    transition: opacity var(--transition-fast);
    cursor: default;
}
#status-text .status-item.tool { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 12%, transparent); }
#status-text .status-item.success { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
#status-text .status-item.error { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
#status-text .status-item.qwen { color: #6a8acc; background: color-mix(in srgb, #6a8acc 12%, transparent); }

/* 调试区域 */
#debug-toggle {
    padding: 4px 8px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--surface-muted);
    flex-shrink: 0;
    transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    line-height: 1;
}
#debug-toggle:hover {
    background: rgba(56,139,253,0.12);
    color: var(--accent);
    border-color: var(--accent);
    box-shadow: var(--shadow-glow);
}

#debug-panel {
    display: none;
    flex: 1;
    min-width: 0;
    height: 100%;
    align-items: center;
}
#debug-panel.open { display: flex; }

#debug-panel-inner {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    height: 100%;
}

#debug-channel {
    width: 120px;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--text-primary);
    padding: 2px 4px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 11px;
    outline: none;
    flex-shrink: 0;
    cursor: pointer;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
#debug-channel:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56,139,253,0.15);
}
#debug-input {
    width: 180px;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--text-primary);
    padding: 2px 8px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 11px;
    outline: none;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    flex-shrink: 0;
}
#debug-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56,139,253,0.15);
}

#debug-run {
    padding: 4px 12px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 11px;
    color: #fff;
    background: var(--accent-gradient);
    font-weight: bold;
    flex-shrink: 0;
    white-space: nowrap;
    transition: opacity var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
    box-shadow: var(--shadow-sm);
}
#debug-run:hover:not(:disabled) {
    box-shadow: var(--shadow-md), var(--shadow-glow);
    transform: translateY(-1px);
}
#debug-run:active:not(:disabled) { transform: translateY(0) scale(0.97); }
#debug-run:disabled { opacity: .5; cursor: not-allowed; }

#debug-status {
    font-size: 10px;
    color: var(--text-muted);
    flex-shrink: 0;
    white-space: nowrap;
}

#debug-output {
    flex: 1;
    min-width: 0;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--text-primary);
    padding: 2px 8px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 20px;
    display: none;
}
#debug-output.show { display: block; }
#debug-output.error { color: var(--danger); }

/* 更新进度条（右下角） */
#update-progress-bar {
    display: none;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    margin-left: 8px;
    font-size: 10px;
    color: var(--text-secondary);
}
#update-progress-bar.show { display: flex; }
#update-progress-track {
    width: 80px;
    height: 5px;
    border-radius: 3px;
    background: var(--surface-muted-strong);
    overflow: hidden;
}
#update-progress-fill {
    width: 0%;
    height: 100%;
    background: var(--accent-gradient);
    border-radius: 3px;
    transition: width .3s var(--transition);
    box-shadow: 0 0 8px rgba(56,139,253,0.4);
}
#update-progress-text {
    min-width: 28px;
    text-align: right;
    white-space: nowrap;
}
</style>
</head>
<body>
    <!-- 暂停/连接按钮 -->
    <div id="pause-btn" onclick="togglePause()" title="点击暂停/恢复 Agent 操作"></div>

    <!-- 状态文字 -->
    <span id="status-text" class="idle"><span id="status-main">就绪</span></span>

    <!-- 停止按钮 -->
    <button id="stop-btn" disabled onclick="doStop()">⏹ 停止</button>

    <!-- 调试按钮 -->
    <button id="debug-toggle" onclick="toggleDebug()" title="通用调试">⚡</button>

    <!-- 调试面板（内嵌在控制栏内） -->
    <div id="debug-panel">
        <div id="debug-panel-inner">
            <select id="debug-channel" title="IPC 通道"><option>agent-exec</option><option>agent-read</option><option>agent-list</option><option>agent-save</option><option>agent-delete</option><option>agent-mkdir</option><option>agent-exists</option><option>agent-info</option><option>winapi-invoke</option><option>titlebar-window-control</option><option>get-menubar-config</option></select>
            <input id="debug-input" placeholder='数据（JSON / 文本）' spellcheck="false">
            <button id="debug-run" onclick="runDebug()" disabled>▶ 执行</button>
            <span id="debug-status"></span>
            <div id="debug-output"></div>
        </div>
    </div>

    <!-- 更新进度条（右下角，更新时显示） -->
    <div id="update-progress-bar">
        <div id="update-progress-track">
            <div id="update-progress-fill"></div>
        </div>
        <span id="update-progress-text">0%</span>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        var isPaused = false;

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').classList.toggle('paused', isPaused);
            ipcRenderer.send('ctrl-toggle-autoexec', !isPaused);
        }

        function doStop() {
            ipcRenderer.send('ctrl-stop');
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('stop-btn').textContent = '⏹ 停止中';
        }

        // 接收状态更新
        ipcRenderer.on('ctrl-status', (event, data) => {
            // 停止按钮状态
            if (data.buttonState) {
                var isGen = data.buttonState === 'generating';
                document.getElementById('stop-btn').disabled = !isGen;
                document.getElementById('stop-btn').textContent = isGen ? '⏹ 停止' : '⏹';
            }

            // 状态文字（使用持久元素，不重复创建）
            var text = '';
            var cls = '';
            switch (data.buttonState) {
                case 'generating':
                    text = 'DeepSeek 正在输出...';
                    cls = 'generating';
                    break;
                case 'done':
                    text = '对话完成 ✓';
                    cls = 'done';
                    break;
                case 'sending':
                    text = '正在发送...';
                    cls = 'generating';
                    break;
                case 'ready':
                    text = '就绪';
                    cls = '';
                    break;
                default:
                    text = data.statusText || '就绪';
                    cls = '';
            }

            // Qwen 状态覆盖
            if (data.qwenState === 'generating') {
                text = 'Qwen 正在输出...';
                cls = 'generating';
            }

            var mainEl = document.getElementById('status-main');
            if (mainEl) {
                mainEl.textContent = text;
                mainEl.className = cls;
            }
        });

        // 接收通知/状态消息（来自主进程）
        ipcRenderer.on('ctrl-notify', (event, msg) => {
            addStatusItem(msg || '就绪', 'success', 3000);
        });

        // 接收 Agent 状态消息（来自 agentview 的 addStatus/showStatus）
        var _statusSeq = 0;
        function addStatusItem(text, type, timeout) {
            if (!text) return;
            if (text === '就绪') return; // 不显示冗余的就绪状态
            var container = document.getElementById('status-text');
            var el = document.createElement('span');
            el.className = 'status-item' + (type ? ' ' + type : '');
            el.textContent = text;
            container.appendChild(el);
            // 滚动到最新
            container.scrollLeft = container.scrollWidth;

            var ttl = timeout || 10000;
            setTimeout(function() {
                el.style.opacity = '0';
                setTimeout(function() {
                    if (el.parentNode) el.remove();
                }, 400);
            }, ttl);
        }

        ipcRenderer.on('ctrl-agent-status', (event, data) => {
            var msg = data.msg || data || '';
            if (typeof msg === 'string' && msg) {
                addStatusItem(msg, data.type || 'tool', 10000);
            }
        });

        // 主题
        ipcRenderer.on('ctrl-theme', (event, theme) => {
            document.body.classList.toggle('light', theme === 'light');
        });

        // ========== 更新进度条 ==========
        var updateProgressTimer = null;
        ipcRenderer.on('ctrl-update-progress', function(event, data) {
            var bar = document.getElementById('update-progress-bar');
            var fill = document.getElementById('update-progress-fill');
            var text = document.getElementById('update-progress-text');
            bar.classList.add('show');
            fill.style.width = data.percent + '%';
            text.textContent = data.percent + '%';
            // 5 秒无新进度则自动隐藏（网络波动时避免残留）
            if (updateProgressTimer) clearTimeout(updateProgressTimer);
            updateProgressTimer = setTimeout(function() {
                bar.classList.remove('show');
            }, 8000);
        });
        ipcRenderer.on('ctrl-update-done', function() {
            var bar = document.getElementById('update-progress-bar');
            var fill = document.getElementById('update-progress-fill');
            var text = document.getElementById('update-progress-text');
            fill.style.width = '100%';
            text.textContent = '100%';
            // 下载完成后 2 秒隐藏
            setTimeout(function() { bar.classList.remove('show'); }, 2000);
        });

        // ========== 通用调试面板 ==========
        var debugOpen = false;
        var debugRunning = false;

        var debugChannel = document.getElementById('debug-channel');
        var debugInput = document.getElementById('debug-input');
        var debugRunBtn = document.getElementById('debug-run');
        var debugOutput = document.getElementById('debug-output');
        var debugStatus = document.getElementById('debug-status');
        var debugStatusText = document.getElementById('status-text');
        var debugStopBtn = document.getElementById('stop-btn');

        // 输入框内容变化时启用/禁用执行按钮
        debugInput.addEventListener('input', function() {
            debugRunBtn.disabled = !this.value.trim();
        });

        // Ctrl+Enter 快捷键执行
        debugInput.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter' && !debugRunBtn.disabled && !debugRunning) {
                runDebug();
            }
        });

        function toggleDebug() {
            debugOpen = !debugOpen;
            document.getElementById('debug-panel').classList.toggle('open', debugOpen);
            debugStatusText.style.display = debugOpen ? 'none' : '';
            debugStopBtn.style.display = debugOpen ? 'none' : '';
            if (debugOpen) debugInput.focus();
        }

        async function runDebug() {
            if (debugRunning) return;
            var channel = debugChannel.value.trim();
            var raw = debugInput.value.trim();
            if (!channel || !raw) return;

            debugRunning = true;
            debugRunBtn.disabled = true;
            debugRunBtn.textContent = '⏳';
            debugStatus.textContent = '执行中...';
            debugStatus.style.color = '#6a6a8a';
            debugOutput.classList.remove('show', 'error');
            debugOutput.textContent = '';

            try {
                // 尝试解析JSON参数
                var payload;
                try { payload = JSON.parse(raw); } catch(e) { payload = raw; }

                // 判断用 invoke 还是 send
                // invoke 式的 IPC（有返回值）
                var invokeChannels = ['agent-exec','agent-read','agent-readFile','agent-save','agent-edit','agent-list','agent-delete','agent-mkdir','agent-exists','agent-info','agent-config-load','winapi-invoke','get-menubar-config','agent-ping'];
                var isInvoke = invokeChannels.indexOf(channel) !== -1;

                var result;
                if (isInvoke) {
                    // invoke 返回 Promise
                    result = await ipcRenderer.invoke(channel, payload);
                } else {
                    // send 不返回结果，直接发送
                    ipcRenderer.send(channel, payload);
                    result = { success: true, message: '已发送到 ' + channel };
                }

                var outStr = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
                // 太长的内容输出到控制台
                if (outStr.length > 200) {
                    ipcRenderer.send('ctrl-debug-log', outStr);
                    debugOutput.textContent = '结果已输出到终端控制台 (' + outStr.length + ' 字符)';
                } else {
                    debugOutput.textContent = outStr;
                }
                debugOutput.classList.add('show');
                debugOutput.classList.remove('error');

                if (result && (result.success || result.error === undefined)) {
                    debugStatus.textContent = '✓';
                    debugStatus.style.color = '#34d399';
                } else {
                    debugStatus.textContent = '✗';
                    debugStatus.style.color = '#ef4444';
                    debugOutput.classList.add('error');
                }
            } catch(e) {
                showDebugError(e.message);
            } finally {
                debugRunning = false;
                debugRunBtn.textContent = '▶';
                debugRunBtn.disabled = !debugInput.value.trim();
            }
        }

        function showDebugError(msg) {
            debugOutput.textContent = msg;
            debugOutput.classList.add('show', 'error');
            debugStatus.textContent = '✗';
            debugStatus.style.color = '#ef4444';
            debugRunning = false;
            debugRunBtn.textContent = '▶';
            debugRunBtn.disabled = false;
        }
    </script>
</body>
</html>
