<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root {
    --bg-base: #0d1117;
    --bg-elevated: #161b22;
    --border: rgba(48,54,61,0.6);
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #388bfd;
    --accent-2: #8957e5;
    --accent-gradient: linear-gradient(135deg, #388bfd, #8957e5);
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
    --cyan: #22d3ee;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
    --shadow-glow: 0 0 12px rgba(56,139,253,0.3);
    --radius-sm: 6px;
    --radius-md: 8px;
    --transition: cubic-bezier(0.4, 0, 0.2, 1);
    --transition-fast: 0.15s var(--transition);
    --transition-normal: 0.25s var(--transition);
    --hover-overlay: rgba(255,255,255,0.06);
    --accent-soft: rgba(56,139,253,0.08);
    --accent-soft-strong: rgba(56,139,253,0.18);
}

body.light {
    --bg-base: #e8e8f0;
    --bg-elevated: #f0f0f5;
    --border: #d0d7de;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --text-muted: #8c959f;
    --accent: #0969da;
    --accent-2: #8250df;
    --accent-gradient: linear-gradient(135deg, #0969da, #8250df);
    --success: #1a7f37;
    --danger: #cf222e;
    --warning: #9a6700;
    --cyan: #0969da;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-glow: 0 0 12px rgba(9,105,218,0.15);
    --hover-overlay: rgba(0,0,0,0.06);
    --accent-soft: rgba(9,105,218,0.06);
    --accent-soft-strong: rgba(9,105,218,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ========== 标题栏（与 agentview/filebrowser 等高 = 38px） ========== */
#titlebar-drag {
    -webkit-app-region: drag;
    width: 100%; height: 38px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, transparent) 0%, color-mix(in srgb, var(--accent-2) 4%, transparent) 100%);
    border-bottom: 1px solid var(--border);
}
#titlebar-drag img { width: 22px; height: 22px; opacity: 0.85; }

body {
    font-family: system-ui, 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, transparent) 0%, color-mix(in srgb, var(--accent-2) 3%, transparent) 40%, transparent 80%), var(--bg-base);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 2px 8px;
    gap: 2px;
    user-select: none;
    overflow-y: auto;
    overflow-x: hidden;
}

/* 分组标签 */
.group-label {
    font-size: 7px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin: 4px 0 1px 0;
    width: 100%;
    text-align: center;
    font-weight: 600;
}

/* 视图/工具按钮 */
.view-btn {
    width: 48px;
    height: 38px;
    border: 2px solid transparent;
    border-radius: var(--radius-md);
    background: transparent;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    transition: all var(--transition-normal);
    position: relative;
    flex-shrink: 0;
}
.view-btn .icon { font-size: 16px; line-height: 1; transition: transform var(--transition-normal); display: flex; align-items: center; justify-content: center; }
.view-btn .icon img { width: 18px; height: 18px; object-fit: contain; }
.view-btn .label {
    font-size: 8px;
    color: var(--text-secondary);
    line-height: 1;
    font-weight: 500;
    transition: color var(--transition-normal);
}
.view-btn:hover {
    background: var(--accent-soft);
    transform: scale(1.04);
}
.view-btn:hover .icon { transform: scale(1.08); }
.view-btn:hover .label { color: var(--text-primary); }
.view-btn.active {
    border-color: var(--accent);
    background: var(--accent-soft-strong);
    box-shadow: var(--shadow-glow);
}
.view-btn.active .label { color: var(--accent); font-weight: 600; }
.view-btn .badge {
    position: absolute;
    top: -1px; right: -1px;
    width: 7px; height: 7px;
    border-radius: 50%;
    display: none;
    border: 1px solid var(--bg-base);
    box-shadow: var(--shadow-sm);
}
.view-btn .badge.on { display: block; }
.view-btn .badge.ds-gen { background: var(--cyan); animation: pulse 1s infinite; }
.view-btn .badge.ds-gen.concurrent { background: #fb923c; }
.view-btn .badge.qw-gen { background: var(--warning); animation: pulse 1s infinite; }

/* 间隔线 */
.sep {
    width: 28px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 3px 0;
    flex-shrink: 0;
}

/* 确认模式小按钮组 */
.confirm-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    align-items: center;
    margin: 2px 0;
}
.confirm-btn {
    width: 48px;
    height: 24px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 9px;
    font-weight: 500;
    text-align: center;
    transition: all var(--transition-normal);
    display: flex;
    align-items: center;
    justify-content: center;
}
.confirm-btn:hover {
    border-color: var(--accent);
    color: var(--text-primary);
    background: var(--accent-soft);
}
.confirm-btn.on {
    border-color: var(--accent);
    background: var(--accent-soft-strong);
    color: var(--accent);
    box-shadow: 0 0 8px rgba(56,139,253,0.2);
}
.confirm-btn.chevron { font-size: 11px; }
.confirm-menu { display: none; flex-direction: column; gap: 2px; width: 100%; align-items: center; margin-top: 2px; }
.confirm-menu.open { display: flex; }

/* 工具按钮（说明/导入） */
.tool-btn {
    width: 48px;
    height: 30px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--text-secondary);
    transition: all var(--transition-normal);
    flex-shrink: 0;
}
.tool-btn:hover {
    background: var(--accent-soft-strong);
    color: var(--accent);
    box-shadow: var(--shadow-glow);
    transform: translateY(-1px);
}
.tool-btn.hidden { display: none; }

/* 主题切换 */
.theme-btn {
    width: 48px;
    height: 30px;
    border: none;
    border-radius: var(--radius-sm);
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-normal);
    flex-shrink: 0;
    margin-top: auto;
}
.theme-btn:hover {
    background: var(--hover-overlay);
    transform: rotate(15deg) scale(1.1);
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(0.85); }
}
</style>
</head>
<body>
    <!-- 图标拖拽区域（无原生标题栏时用于拖动窗口） -->
    <div id="titlebar-drag">
        <img id="app-icon" src="">
    </div>

    <!-- 视图按钮 -->
    <div class="group-label">视图</div>
    <button class="view-btn active" data-view="deepseek" onclick="switchView('deepseek')" title="DeepSeek">
        <span class="icon"><img src="build/deepseek.png" alt="DS"></span>
        <span class="label">DS</span>
        <span class="badge ds-gen" id="b-ds"></span>
    </button>
    <button class="view-btn" data-view="qwen" onclick="switchView('qwen')" title="Qwen">
        <span class="icon"><img src="build/qwen.png" alt="QW"></span>
        <span class="label">QW</span>
        <span class="badge qw-gen" id="b-qw"></span>
    </button>
    <button class="view-btn" data-view="agent" onclick="switchView('agent')" title="Agent">
        <span class="icon">🤖</span>
        <span class="label">AG</span>
    </button>
    <button class="view-btn" data-view="follow" onclick="switchView('follow')" title="跟随">
        <span class="icon">👁</span>
        <span class="label">FL</span>
    </button>

    <div class="sep"></div>
    <div class="group-label">工具</div>

    <!-- 说明按钮（仅 DeepSeek 视图下显示） -->
    <button class="tool-btn" id="intro-btn" onclick="showIntro()" title="查看使用说明">💡</button>

    <!-- 导入技能 -->
    <button class="tool-btn" onclick="importSkills()" title="导入技能文件夹（SKILL.md 格式）">📥</button>

    <!-- 查看技能 -->
    <button class="tool-btn" id="skills-btn" onclick="showSkills()" title="查看已加载的技能">🧩</button>

    <div class="sep"></div>
    <div class="group-label">审核</div>

    <!-- 确认模式 -->
    <div class="confirm-group">
        <button class="confirm-btn on" id="confirm-current" data-mode="smart" onclick="toggleConfirmMenu()">智能</button>
        <div id="confirm-menu" class="confirm-menu">
            <button class="confirm-btn" data-mode="smart" onclick="setConfirmMode('smart')">智能</button>
            <button class="confirm-btn" data-mode="strict" onclick="setConfirmMode('strict')">严格</button>
            <button class="confirm-btn" data-mode="loose" onclick="setConfirmMode('loose')">宽松</button>
            <button class="confirm-btn" data-mode="readonly" onclick="setConfirmMode('readonly')">只读</button>
            <button class="confirm-btn chevron" data-mode="custom" onclick="showCustomConfirmMode()">自定义</button>
        </div>
    </div>

    <!-- 自定义确认模式弹窗 -->
    <div id="custom-confirm-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
        <div style="background:#222240;border:1px solid #3a3a6a;border-radius:16px;padding:20px;max-width:340px;width:92%;margin:20px;">
            <h3 style="margin:0 0 12px;color:#e0e0f0;font-size:15px;">自定义审核模式</h3>
            <div style="margin-bottom:8px;font-size:12px;color:#8a8aaa;">勾选需要确认的操作：</div>
            <div id="custom-confirm-options" style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:12px;color:#aaa;">
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" data-key="delete" checked> 删除文件</label>
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" data-key="exec"> 执行命令</label>
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" data-key="write"> 写入/修改文件</label>
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" data-key="edit"> 自动编辑文件</label>
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" data-key="mkdir"> 创建目录</label>
            </div>
            <div style="display:flex;gap:10px;">
                <button onclick="document.getElementById('custom-confirm-modal').style.display='none'" style="flex:1;padding:8px 0;background:transparent;color:#8a8aaa;border:1px solid #3a3a6a;border-radius:8px;cursor:pointer;font-size:12px;">取消</button>
                <button onclick="saveCustomConfirmMode()" style="flex:1;padding:8px 0;background:linear-gradient(135deg,#0d7377,#0ea5e9);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;">保存</button>
            </div>
        </div>
    </div>

    <!-- 主题切换 -->
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>

    <script>
        const { ipcRenderer } = require('electron');

        var currentView = 'deepseek';
        var currentConfirmMode = 'smart';
        var currentTheme = 'dark';

        // ====== 视图切换 ======
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-view') === view);
            });
            // 说明按钮可见性
            document.getElementById('intro-btn').classList.toggle('hidden', view !== 'deepseek');
            ipcRenderer.send('ctrl-view-select', view);
        }

        // ====== 说明 ======
        function showIntro() {
            ipcRenderer.send('ctrl-show-intro');
        }

        // ====== 导入技能 ======
        function importSkills() {
            ipcRenderer.send('ctrl-import-skills');
        }

        // ====== 查看技能 ======
        function showSkills() {
            ipcRenderer.send('ctrl-show-skills');
        }

        // ====== 确认模式 ======
        var confirmMenuOpen = false;
        var customConfirmRules = { delete: true, exec: false, write: false, edit: false, mkdir: false };

        function toggleConfirmMenu() {
            confirmMenuOpen = !confirmMenuOpen;
            var menu = document.getElementById('confirm-menu');
            if (confirmMenuOpen) menu.classList.add('open');
            else menu.classList.remove('open');
        }

        function setConfirmMode(mode) {
            currentConfirmMode = mode;
            updateConfirmUI();
            ipcRenderer.send('ctrl-set-confirm-mode', mode);
            closeConfirmMenu();
        }

        function closeConfirmMenu() {
            confirmMenuOpen = false;
            document.getElementById('confirm-menu').classList.remove('open');
        }

        function updateConfirmUI() {
            var currentBtn = document.getElementById('confirm-current');
            var labels = { smart: '智能', strict: '严格', loose: '宽松', readonly: '只读', custom: '自定义' };
            var displayMode = currentConfirmMode;
            // 如果当前是 custom:xxx，显示为自定义
            if (displayMode.indexOf('custom:') === 0) displayMode = 'custom';
            currentBtn.textContent = labels[displayMode] || '智能';
            currentBtn.setAttribute('data-mode', currentConfirmMode);

            document.querySelectorAll('.confirm-btn').forEach(function(b) {
                var bm = b.getAttribute('data-mode');
                if (bm === 'smart' || bm === 'strict' || bm === 'loose' || bm === 'readonly') {
                    b.classList.toggle('on', bm === displayMode);
                } else if (bm === 'custom') {
                    b.classList.toggle('on', displayMode === 'custom');
                }
            });
        }

        function showCustomConfirmMode() {
            closeConfirmMenu();
            document.getElementById('custom-confirm-modal').style.display = 'flex';
            // 解析当前 custom: 规则
            var rules = parseCustomMode(currentConfirmMode);
            document.querySelectorAll('#custom-confirm-options input').forEach(function(cb) {
                cb.checked = !!rules[cb.getAttribute('data-key')];
            });
        }

        function parseCustomMode(modeStr) {
            var rules = { delete: true, exec: false, write: false, edit: false, mkdir: false };
            if (!modeStr || modeStr.indexOf('custom:') !== 0) return rules;
            var parts = modeStr.replace('custom:', '').split(',');
            parts.forEach(function(p) {
                var kv = p.split('=');
                if (kv.length === 2) rules[kv[0].trim()] = kv[1].trim() === '1';
            });
            return rules;
        }

        function serializeCustomMode(rules) {
            var parts = [];
            ['delete', 'exec', 'write', 'edit', 'mkdir'].forEach(function(k) {
                parts.push(k + '=' + (rules[k] ? '1' : '0'));
            });
            return 'custom:' + parts.join(',');
        }

        function saveCustomConfirmMode() {
            var rules = {};
            document.querySelectorAll('#custom-confirm-options input').forEach(function(cb) {
                rules[cb.getAttribute('data-key')] = cb.checked;
            });
            var mode = serializeCustomMode(rules);
            setConfirmMode(mode);
            document.getElementById('custom-confirm-modal').style.display = 'none';
        }

        // ====== 主题切换 ======
        function toggleTheme() {
            var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            currentTheme = newTheme;
            document.getElementById('theme-btn').textContent = newTheme === 'dark' ? '🌙' : '☀️';
            document.body.classList.toggle('light', newTheme === 'light');
            // 通过主进程广播给所有视图
            ipcRenderer.send('ctrl-set-theme', newTheme);
        }

        // ====== 接收状态同步 ======
        ipcRenderer.on('ctrl-viewbar-status', (event, data) => {
            if (data.currentView && data.currentView !== currentView) {
                currentView = data.currentView;
                document.querySelectorAll('.view-btn').forEach(function(b) {
                    b.classList.toggle('active', b.getAttribute('data-view') === currentView);
                });
                document.getElementById('intro-btn').classList.toggle('hidden', currentView !== 'deepseek');
            }
            if (data.confirmMode && data.confirmMode !== currentConfirmMode) {
                currentConfirmMode = data.confirmMode;
                updateConfirmUI();
            }
            // 生成状态指示器
            document.getElementById('b-ds').classList.toggle('on', data.dsState === 'generating');
            document.getElementById('b-ds').classList.toggle('concurrent', !!data.dsConcurrent);
            document.getElementById('b-qw').classList.toggle('on', data.qwenState === 'generating');
            // 主题同步
            if (data.theme && data.theme !== currentTheme) {
                currentTheme = data.theme;
                document.getElementById('theme-btn').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
                document.body.classList.toggle('light', currentTheme === 'light');
            }
        });

        // 主题同步（来自主进程广播）
        ipcRenderer.on('ctrl-theme', (event, theme) => {
            currentTheme = theme;
            document.getElementById('theme-btn').textContent = theme === 'dark' ? '🌙' : '☀️';
            document.body.classList.toggle('light', theme === 'light');
        });

        // 技能计数同步
        ipcRenderer.on('ctrl-skills-count', function(event, count) {
            var btn = document.getElementById('skills-btn');
            btn.textContent = count > 0 ? '🧩(' + count + ')' : '🧩';
        });

        // 页面加载后从主进程同步一次当前确认模式
        ipcRenderer.invoke('agent-config-load').then(function(res) {
            if (res.success && res.config && res.config.confirmMode) {
                currentConfirmMode = res.config.confirmMode;
                updateConfirmUI();
            }
        }).catch(function() {});

        // 加载应用图标
        var imgEl = document.getElementById('app-icon');
        if (imgEl) {
            var path = require('path');
            var iconPath = 'file://' + path.resolve(__dirname, 'build/icon.ico').replace(/\\/g, '/');
            imgEl.src = iconPath;
        }
    </script>
</body>
</html>
